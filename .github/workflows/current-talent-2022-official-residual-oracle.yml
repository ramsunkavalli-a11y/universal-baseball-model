name: Current Talent 2022 official residual oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Query six official season and gameLog oracles
        run: python scripts/diagnose_current_talent_2022_official_residual_oracle.py
      - name: Upload oracle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-2022-official-residual-oracle
          path: reports/generated/current-talent-2022-official-residual-oracle/
          if-no-files-found: warn
          retention-days: 14
