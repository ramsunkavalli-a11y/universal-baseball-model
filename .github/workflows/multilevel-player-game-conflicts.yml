name: Multilevel player-game conflict audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit unresolved player-game snapshots
        run: python scripts/audit_multilevel_player_game_conflicts.py

      - name: Upload conflict report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multilevel-player-game-conflicts
          path: reports/generated/multilevel-player-game-conflicts/
          if-no-files-found: warn
          retention-days: 14
