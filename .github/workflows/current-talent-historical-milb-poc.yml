name: Current Talent historical MiLB evidence POC

on:
  workflow_dispatch:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/current-talent-historical-milb-poc.yml"
      - "scripts/poc_current_talent_historical_milb_game_evidence.py"
      - "src/universal_baseball/current_talent_era.py"
      - "src/universal_baseball/current_talent_milb_source.py"
      - "src/universal_baseball/current_talent_milb_evidence.py"
      - "src/universal_baseball/armstjc_contacts.py"
      - "src/universal_baseball/contact_identity_overlay.py"
      - "src/universal_baseball/player_game_controls.py"
      - "src/universal_baseball/player_game_stats.py"
      - "tests/test_current_talent_era.py"
      - "tests/test_current_talent_milb_source.py"

permissions:
  contents: read

jobs:
  poc:
    strategy:
      fail-fast: false
      matrix:
        level: [aaa, aa, "a+", a, rk]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run historical Current Talent unit tests
        run: >-
          python -m pytest
          tests/test_current_talent_era.py
          tests/test_current_talent_milb_source.py
          tests/test_current_talent_milb_evidence.py
          tests/test_current_talent_evidence.py

      - name: Run 2022 historical game-evidence POC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/poc_current_talent_historical_milb_game_evidence.py
          --season 2022
          --level "${{ matrix.level }}"
          --games-per-league 8

      - name: Upload POC artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-historical-milb-poc-${{ matrix.level }}
          path: reports/generated/current-talent-historical-milb-poc/2022/${{ matrix.level }}/
          if-no-files-found: warn
          retention-days: 14
