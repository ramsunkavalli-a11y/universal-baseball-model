name: Projection 2024 exact-game source-gap audit recovery

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/projection-2024-exact-game-source-gap-audit-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Apply interrupted import-only recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/audit_projection_2024_exact_game_source_gaps.py")
          text = path.read_text()
          old = "from universal_baseball.official import capture_official_json, project_official_play_by_play"
          new = "from universal_baseball.official import project_official_play_by_play\nfrom universal_baseball.official_capture import capture_official_json"
          if old not in text:
              raise SystemExit("expected interrupted import line not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Compile exact-game audit
        run: python -m py_compile scripts/audit_projection_2024_exact_game_source_gaps.py

      - name: Audit exact official game surfaces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_projection_2024_exact_game_source_gaps.py

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: projection-2024-exact-game-source-gap-audit-recovery
          path: reports/generated/projection-2024-exact-game-source-gap-audit/
          if-no-files-found: warn
          retention-days: 14
