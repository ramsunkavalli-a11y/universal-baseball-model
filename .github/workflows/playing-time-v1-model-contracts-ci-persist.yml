name: Playing-time v1 model contracts persisted CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and playing-time dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install -r requirements-playing-time.txt

      - name: Run frozen playing-time model contract tests
        id: contract_tests
        continue-on-error: true
        run: >-
          python -m py_compile src/universal_baseball/playing_time_model.py
          && python -m pytest -q tests/test_playing_time_model.py

      - name: Persist playing-time model contract CI result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.contract_tests.outcome }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {
              "gate": "playing_time_v1_model_contracts_ci",
              "status": os.environ["TEST_OUTCOME"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "2025_accessed": False,
              "real_target_scoring_performed": False,
          }
          Path("docs/playing-time-v1-model-contracts-ci-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/playing-time-v1-model-contracts-ci-result.json
          git commit -m "Persist playing-time v1 model contracts CI result"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce playing-time model contract tests
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.contract_tests.outcome }}
        run: test "$TEST_OUTCOME" = "success"
