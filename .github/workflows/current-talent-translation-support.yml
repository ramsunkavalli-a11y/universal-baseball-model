name: Current Talent translation support diagnostic

on:
  # One-time stability bootstrap for Aug. 1, 2022 and Aug. 1, 2023; remove after both resolve.
  push:
    branches:
      - source-certification-poc
    paths:
      - .github/workflows/current-talent-translation-support.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing five certified MiLB game-evidence artifacts
        required: true
        default: "31980820797"
        type: string
      milb_artifact_pattern:
        description: Artifact-name glob selecting the five certified MiLB level artifacts
        required: true
        default: "ct-validation-game-evidence-2021-*"
        type: string
      mlb_source_run_id:
        description: Certified historical MLB workflow run for the same season
        required: true
        default: "31986504169"
        type: string
      season:
        description: Season represented by the source artifacts
        required: true
        default: "2021"
        type: string
      training_end:
        description: Exclusive training cutoff YYYY-MM-DD
        required: true
        default: "2021-08-01"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'push' && fromJSON('[{"season":"2022","source_run_id":"31971662070","milb_artifact_pattern":"current-talent-historical-milb-full-season-*","mlb_source_run_id":"31988255280","training_end":"2022-08-01"},{"season":"2023","source_run_id":"31971923778","milb_artifact_pattern":"current-talent-historical-milb-full-season-2023-*","mlb_source_run_id":"31989561396","training_end":"2023-08-01"}]') || fromJSON(format('[{{"season":"{0}","source_run_id":"{1}","milb_artifact_pattern":"{2}","mlb_source_run_id":"{3}","training_end":"{4}"}}]', inputs.season, inputs.source_run_id, inputs.milb_artifact_pattern, inputs.mlb_source_run_id, inputs.training_end)) }}
    env:
      SOURCE_RUN_ID: ${{ matrix.source_run_id }}
      MILB_ARTIFACT_PATTERN: ${{ matrix.milb_artifact_pattern }}
      MLB_SOURCE_RUN_ID: ${{ matrix.mlb_source_run_id }}
      TARGET_SEASON: ${{ matrix.season }}
      TRAINING_END: ${{ matrix.training_end }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run translation foundation tests
        run: >-
          python -m pytest
          tests/test_current_talent_translation.py
          tests/test_current_talent_universal_evidence.py
      - name: Download certified five-level MiLB game evidence
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.MILB_ARTIFACT_PATTERN }}
          path: reports/generated/current-talent-translation-inputs/${{ env.TARGET_SEASON }}/milb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download certified MLB game evidence
        uses: actions/download-artifact@v8
        with:
          name: current-talent-historical-mlb-${{ env.TARGET_SEASON }}
          path: reports/generated/current-talent-translation-inputs/${{ env.TARGET_SEASON }}/mlb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: ${{ env.MLB_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Materialize MLB-connected matched-environment support
        run: >-
          python scripts/materialize_current_talent_translation_support.py
          --input-root "reports/generated/current-talent-translation-inputs/${TARGET_SEASON}/milb"
          --mlb-input-root "reports/generated/current-talent-translation-inputs/${TARGET_SEASON}/mlb"
          --season "${TARGET_SEASON}"
          --training-end "${TRAINING_END}"
          --min-core-events-per-stint 20
          --max-gap-days 365
          --output-dir "reports/generated/current-talent-translation-support/${TARGET_SEASON}/${TRAINING_END}"
      - name: Upload translation support artifact
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-translation-support-${{ env.TARGET_SEASON }}-${{ env.TRAINING_END }}
          path: reports/generated/current-talent-translation-support/${{ env.TARGET_SEASON }}/${{ env.TRAINING_END }}/
          if-no-files-found: error
          retention-days: 14
