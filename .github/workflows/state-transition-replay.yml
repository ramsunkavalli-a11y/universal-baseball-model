name: State transition replay audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-state-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit state transition replay
        run: python scripts/audit_state_transition_replay.py

      - name: Upload transition audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: state-transition-replay
          path: reports/generated/state-transition-replay/
          if-no-files-found: warn
          retention-days: 14
