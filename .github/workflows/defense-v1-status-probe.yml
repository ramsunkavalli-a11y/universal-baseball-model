# retrigger status-only probe; no model/source change
name: Defense v1 workflow status probe

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/defense-v1-status-probe.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture Defense workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          workflows = {
              "tracked_source": "defense-v1-tracked-source.yml",
          }
          out = {"gate": "defense_v1_workflow_status_probe", "workflows": {}}
          env = dict(os.environ)
          for key, workflow in workflows.items():
              result = subprocess.run([
                  "gh", "run", "list",
                  "--repo", "ramsunkavalli-a11y/universal-baseball-model",
                  "--workflow", workflow,
                  "--branch", "source-certification-poc",
                  "--limit", "5",
                  "--json", "databaseId,status,conclusion,headSha,createdAt,updatedAt,displayTitle,url",
              ], check=True, text=True, capture_output=True, env=env)
              out["workflows"][key] = json.loads(result.stdout)
          Path("docs/defense-v1-workflow-status.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Persist status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-workflow-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Defense v1 workflow status"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
