name: armstjc asset inventory audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Inventory public PBP release assets
        run: python scripts/audit_armstjc_asset_inventory.py

      - name: Upload inventory report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: armstjc-asset-inventory
          path: reports/generated/armstjc-asset-inventory/
          if-no-files-found: warn
          retention-days: 14
