name: Current Talent contact-value confirmation refit

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - "scripts/refit_current_talent_contact_value_confirmation.py"
      - ".github/workflows/current-talent-contact-value-confirmation-refit.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify frozen standardization and WLS contracts
        run: >-
          python -m pytest
          tests/test_current_talent_contact_value.py
          tests/test_current_talent_batted_ball_standardization.py

      - name: Seed accepted baseline fit artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-baseline-fits
          path: seeded/baseline
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075112279
          github-token: ${{ github.token }}

      - name: Seed accepted richer feature artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-features
          path: seeded/features
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075892988
          github-token: ${{ github.token }}

      - name: Require passed 2022 development gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/current-talent-contact-value-development-result.json")
          report = json.loads(path.read_text())
          if report.get("gate") != "current_talent_contact_value_2022_development":
              raise SystemExit("unexpected Challenger 2 development result")
          if report.get("eligible_for_fixed_2023_confirmation") is not True:
              raise SystemExit("2022 development did not authorize confirmation")
          checks = report.get("promotion_checks", {})
          if not checks or not all(checks.values()):
              raise SystemExit("not all frozen Challenger 2 promotion checks passed")
          boundary = report.get("boundary", {})
          if boundary.get("accessed_2023") is not False:
              raise SystemExit("development result already accessed 2023")
          if boundary.get("confirmation_data_present") is not False:
              raise SystemExit("development result contains confirmation data")
          print(json.dumps({"eligible_for_fixed_2023_confirmation": True, "promotion_checks": checks}, indent=2))
          PY

      - name: Compile confirmation refit
        run: python -m py_compile scripts/refit_current_talent_contact_value_confirmation.py

      - name: Refit frozen form on 2021 and 2022 annual training snapshots
        shell: bash
        run: |
          set +e
          set -o pipefail
          root="reports/generated/current-talent-contact-value-confirmation-refit"
          mkdir -p "$root"
          python scripts/refit_current_talent_contact_value_confirmation.py \
            --baseline-root seeded/baseline \
            --feature-root seeded/features \
            --development-result docs/current-talent-contact-value-development-result.json \
            2>&1 | tee "$root/refit.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$root/refit-exit-code.txt"
          exit "$status"

      - name: Persist confirmation refit or diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="reports/generated/current-talent-contact-value-confirmation-refit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$root/report.json" ]; then
            cp "$root/report.json" docs/current-talent-contact-value-confirmation-refit-result.json
          fi
          if [ -f "$root/refit.log" ]; then
            cp "$root/refit.log" docs/current-talent-contact-value-confirmation-refit-latest.log
          fi
          if [ -f "$root/refit-exit-code.txt" ]; then
            cp "$root/refit-exit-code.txt" docs/current-talent-contact-value-confirmation-refit-exit-code.txt
          fi
          git add \
            docs/current-talent-contact-value-confirmation-refit-result.json \
            docs/current-talent-contact-value-confirmation-refit-latest.log \
            docs/current-talent-contact-value-confirmation-refit-exit-code.txt \
            2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f "$root/report.json" ]; then
            git commit -m "Persist Challenger 2 confirmation refit"
          else
            git commit -m "Persist Challenger 2 confirmation refit diagnostics"
          fi
          git push

      - name: Upload confirmation refit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-confirmation-refit
          path: reports/generated/current-talent-contact-value-confirmation-refit/
          if-no-files-found: warn
          retention-days: 14
