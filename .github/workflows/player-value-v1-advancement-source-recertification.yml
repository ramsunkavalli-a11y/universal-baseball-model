name: Player Value v1 advancement source recertification

on:
  push:
    branches: [source-certification-poc]
    paths:
      - ".github/workflows/player-value-v1-advancement-source-recertification.yml"
      - "scripts/recertify_player_value_v1_advancement_history.py"
      - "tests/test_player_value_advancement_source_recertification.py"
      - "docs/player-value-v1-advancement-source-recertification-contract.md"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test recertification implementation
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]" &&
          python -m pytest -q
          tests/test_player_value_advancement_source_recertification.py
          tests/test_player_value_advancement_projection.py
          tests/test_player_value_baserunning_sources.py
      - name: Materialize projection-relevant advancement history
        run: >-
          python scripts/recertify_player_value_v1_advancement_history.py
          --output-table reports/generated/player-value-v1-advancement-history-recertified-2019-2024.parquet
          --output-result docs/player-value-v1-advancement-source-recertification-result.json
      - name: Upload immutable recertified history
        id: source_artifact
        uses: actions/upload-artifact@v7
        with:
          name: player-value-v1-advancement-history-recertified-2019-2024
          path: reports/generated/player-value-v1-advancement-history-recertified-2019-2024.parquet
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable artifact identity
        env:
          ARTIFACT_ID: ${{ steps.source_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.source_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.source_artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          jq \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg url "$ARTIFACT_URL" \
            '.status="player_value_v1_advancement_source_recertification_frozen_verified" |
             .immutable_artifact={
               name:"player-value-v1-advancement-history-recertified-2019-2024",
               artifact_id:$artifact_id,
               digest:$digest,
               url:$url,
               retention_days:90
             }' \
            docs/player-value-v1-advancement-source-recertification-result.json \
            > docs/player-value-v1-advancement-source-recertification-result.tmp.json
          mv docs/player-value-v1-advancement-source-recertification-result.tmp.json \
            docs/player-value-v1-advancement-source-recertification-result.json
      - name: Persist verified recertification result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-advancement-source-recertification-result.json
          git commit -m "Freeze recertified advancement source artifact"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
