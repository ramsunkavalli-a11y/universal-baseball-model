name: Current Talent contact-value description-source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile description-source audit
        run: python -m py_compile scripts/audit_current_talent_contact_value_description_source.py

      - name: Audit reusable PA descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_current_talent_contact_value_description_source.py

      - name: Upload description-source audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-description-source
          path: reports/generated/current-talent-contact-value-description-source/
          if-no-files-found: warn
          retention-days: 14
