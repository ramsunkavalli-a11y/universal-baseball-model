name: Current Talent contact-value Challenger 2 development

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify frozen scoring and geometry contracts
        run: >-
          python -m pytest
          tests/test_current_talent_contact_value.py
          tests/test_current_talent_contact_value_prediction.py
          tests/test_current_talent_contact_value_scoring.py

      - name: Seed accepted baseline fit artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-baseline-fits
          path: seeded/baseline
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075112279
          github-token: ${{ github.token }}

      - name: Seed accepted richer feature artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-features
          path: seeded/features
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075892988
          github-token: ${{ github.token }}

      - name: Require accepted pre-scoring gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          residual = json.loads(Path("docs/current-talent-contact-value-residual-fit-result.json").read_text())
          geometry = json.loads(Path("docs/current-talent-contact-value-prediction-geometry-result.json").read_text())
          if residual.get("gate") != "current_talent_contact_value_residual_fit_2021_training_only":
              raise SystemExit("residual fit gate not accepted")
          if geometry.get("gate") != "current_talent_contact_value_prediction_geometry_pre_scoring":
              raise SystemExit("prediction geometry gate not accepted")
          if residual.get("boundary", {}).get("2022_future_outcomes_accessed") is not False:
              raise SystemExit("residual fit used 2022 outcomes")
          if geometry.get("boundary", {}).get("development_losses_computed") is not False:
              raise SystemExit("prediction geometry already computed losses")
          if residual.get("boundary", {}).get("accessed_2023") is not False or geometry.get("boundary", {}).get("accessed_2023") is not False:
              raise SystemExit("pre-scoring gates accessed 2023")
          PY

      - name: Compile frozen development evaluator
        run: python -m py_compile scripts/evaluate_current_talent_contact_value_development.py

      - name: Evaluate fixed 2022 Challenger 2
        shell: bash
        run: |
          set +e
          set -o pipefail
          root="reports/generated/current-talent-contact-value-development"
          mkdir -p "$root"
          python scripts/evaluate_current_talent_contact_value_development.py \
            --baseline-root seeded/baseline \
            --feature-root seeded/features \
            --residual-result docs/current-talent-contact-value-residual-fit-result.json \
            --geometry-result docs/current-talent-contact-value-prediction-geometry-result.json \
            2>&1 | tee "$root/evaluator.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$root/evaluator-exit-code.txt"
          exit "$status"

      - name: Persist development result or diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="reports/generated/current-talent-contact-value-development"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$root/report.json" ]; then
            cp "$root/report.json" docs/current-talent-contact-value-development-result.json
          fi
          if [ -f "$root/evaluator.log" ]; then
            cp "$root/evaluator.log" docs/current-talent-contact-value-development-latest.log
          fi
          if [ -f "$root/evaluator-exit-code.txt" ]; then
            cp "$root/evaluator-exit-code.txt" docs/current-talent-contact-value-development-exit-code.txt
          fi
          git add \
            docs/current-talent-contact-value-development-result.json \
            docs/current-talent-contact-value-development-latest.log \
            docs/current-talent-contact-value-development-exit-code.txt \
            2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f "$root/report.json" ]; then
            git commit -m "Persist Challenger 2 development result"
          else
            git commit -m "Persist Challenger 2 development diagnostics"
          fi
          git push

      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-development
          path: reports/generated/current-talent-contact-value-development/
          if-no-files-found: warn
          retention-days: 14
