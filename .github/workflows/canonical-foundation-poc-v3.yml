name: Canonical foundation POC v3

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/canonical-foundation-poc-v3.yml"

permissions:
  contents: read

jobs:
  foundation-poc-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Build one-game canonical foundation POC
        run: python scripts/build_canonical_foundation_poc.py

      - name: Validate and persist event semantics
        run: python scripts/validate_canonical_semantics_poc.py

      - name: Validate game grain and temporal modes
        run: python scripts/validate_foundation_game_temporal_poc.py

      - name: Upload foundation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-foundation-poc-v3
          path: reports/generated/foundation-poc/
          if-no-files-found: warn
          retention-days: 14
