name: Current Talent validation snapshot multilevel MiLB

on:
  # One-time self-bootstrap; remove after the first combined real-data run.
  push:
    branches:
      - source-certification-poc
    paths:
      - .github/workflows/current-talent-validation-snapshot-multilevel.yml
  workflow_dispatch:
    inputs:
      season:
        description: Post-reorganization season to materialize
        required: true
        default: "2021"
        type: choice
        options:
          - "2021"
          - "2022"
          - "2023"
      snapshot_month:
        description: Month-start Current Talent cutoff
        required: true
        default: "8"
        type: choice
        options:
          - "5"
          - "6"
          - "7"
          - "8"
          - "9"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run validation and evidence contract tests
        run: >-
          python -m pytest
          tests/test_current_talent_evidence.py
          tests/test_current_talent_universal_evidence.py
          tests/test_current_talent_validation.py
          tests/test_current_talent_validation_dataset.py

  materialize:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - filename_level: aaa
            level_dir: aaa
            artifact_suffix: aaa
          - filename_level: aa
            level_dir: aa
            artifact_suffix: aa
          - filename_level: "a+"
            level_dir: aplus
            artifact_suffix: aplus
          - filename_level: a
            level_dir: a
            artifact_suffix: a
          - filename_level: rk
            level_dir: rk
            artifact_suffix: rk
    env:
      TARGET_SEASON: ${{ inputs.season || '2021' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Materialize certified historical game evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/materialize_current_talent_historical_milb_game_evidence.py
          --season "${TARGET_SEASON}"
          --level "${{ matrix.filename_level }}"
      - name: Upload level game evidence
        uses: actions/upload-artifact@v7
        with:
          name: ct-validation-game-evidence-${{ env.TARGET_SEASON }}-${{ matrix.artifact_suffix }}
          path: reports/generated/current-talent-historical-milb-game-evidence/${{ env.TARGET_SEASON }}/${{ matrix.level_dir }}/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SEASON: ${{ inputs.season || '2021' }}
      SNAPSHOT_MONTH: ${{ inputs.snapshot_month || '8' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Download five certified level artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ct-validation-game-evidence-${{ env.TARGET_SEASON }}-*
          path: reports/generated/current-talent-validation-inputs/${{ env.TARGET_SEASON }}
      - name: Resolve cutoff
        run: |
          printf -v month "%02d" "${SNAPSHOT_MONTH}"
          echo "CUTOFF=${TARGET_SEASON}-${month}-01" >> "$GITHUB_ENV"
      - name: Materialize combined MiLB validation snapshot
        run: >-
          python scripts/materialize_current_talent_validation_snapshot_multilevel.py
          --input-root "reports/generated/current-talent-validation-inputs/${TARGET_SEASON}"
          --season "${TARGET_SEASON}"
          --cutoff "${CUTOFF}"
          --window-label all_history
          --output-dir "reports/generated/current-talent-validation-snapshot-multilevel/${TARGET_SEASON}/${CUTOFF}"
      - name: Upload multilevel validation snapshot
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-validation-snapshot-multilevel-${{ env.TARGET_SEASON }}-${{ env.SNAPSHOT_MONTH }}
          path: reports/generated/current-talent-validation-snapshot-multilevel/${{ env.TARGET_SEASON }}/${{ env.CUTOFF }}/
          if-no-files-found: error
          retention-days: 14
