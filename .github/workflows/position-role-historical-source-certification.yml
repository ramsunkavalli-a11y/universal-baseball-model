name: Position-role historical source certification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify frozen source semantics
        run: >-
          python -m py_compile
          src/universal_baseball/position_role_source.py
          scripts/certify_position_role_historical_source.py
          && python -m pytest -q tests/test_position_role_source.py

      - name: Certify 2021-2024 official fielding source
        id: certify
        shell: bash
        run: |
          set +e
          python scripts/certify_position_role_historical_source.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload historical source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: position-role-historical-source-2021-2024
          path: |
            reports/generated/position-role-historical-source/
            data/quarantine/position-role-historical-source/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve binding result and recovery artifact separately
        if: always()
        run: |
          test -f docs/position-role-historical-source-result.json
          test -f reports/generated/position-role-historical-source/report.json
          echo "The committed binding result is immutable; this rerun remains in the uploaded recovery artifact."

      - name: Enforce fail-closed historical decision
        if: always()
        env:
          CERTIFY_EXIT_CODE: ${{ steps.certify.outputs.exit_code }}
        run: |
          test "${CERTIFY_EXIT_CODE:-1}" -eq 0
