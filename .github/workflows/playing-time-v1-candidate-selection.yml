name: Playing-time v1 2022 candidate selection

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and playing-time dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install -r requirements-playing-time.txt

      - name: Require green pre-model contract gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/playing-time-v1-model-contracts-ci-result.json')
          if not path.exists():
              raise SystemExit('playing-time model contracts CI result is missing')
          result = json.loads(path.read_text())
          if result.get('status') != 'success':
              raise SystemExit(f"playing-time model contracts CI is not green: {result}")
          if result.get('2025_accessed'):
              raise SystemExit('pre-model contract gate claims 2025 access')
          print(f"Using green pre-model contract run {result.get('source_run_id')}")
          PY

      - name: Verify frozen playing-time selection code before source/data work
        run: >-
          python -m py_compile
          src/universal_baseball/playing_time_model.py
          src/universal_baseball/playing_time_selection.py
          src/universal_baseball/playing_time_roster_source.py
          scripts/materialize_playing_time_v1_target_surface.py
          scripts/materialize_playing_time_v1_predictor_surface.py
          scripts/materialize_playing_time_v1_candidate_selection.py
          scripts/audit_playing_time_historical_40man_membership.py
          && python -m pytest -q
          tests/test_playing_time_model.py
          tests/test_playing_time_selection.py
          tests/test_playing_time_roster_source.py

      - name: Seed immutable certified 2021-2024 universal evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="ramsunkavalli-a11y/universal-baseball-model"
          mkdir -p seeded

          download() {
            local run_id="$1"
            local artifact="$2"
            local dest="$3"
            mkdir -p "$dest"
            gh run download "$run_id" --repo "$repo" --name "$artifact" --dir "$dest"
          }

          for level in aaa aa 'a+' a rk; do
            download 31979609553 "current-talent-historical-milb-full-season-2021-${level}" "seeded/2021/milb/${level}"
            download 31971662070 "current-talent-historical-milb-full-season-${level}" "seeded/2022/milb/${level}"
            download 31971923778 "current-talent-historical-milb-full-season-2023-${level}" "seeded/2023/milb/${level}"
            download 32095039114 "current-talent-historical-milb-full-season-2024-${level}" "seeded/2024/milb/${level}"
          done

          download 31986504169 "current-talent-historical-mlb-2021" "seeded/2021/mlb"
          download 31988255280 "current-talent-historical-mlb-2022" "seeded/2022/mlb"
          download 31989561396 "current-talent-historical-mlb-2023" "seeded/2023/mlb"
          download 32096473700 "current-talent-historical-mlb-2024" "seeded/2024/mlb"

      - name: Download immutable Projection development targets
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-development-evidence
          path: inputs/development-evidence
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32097702869
          github-token: ${{ github.token }}

      - name: Download immutable frozen B2 snapshots
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-current-talent-snapshots
          path: inputs/current-talent-snapshots
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32099733186
          github-token: ${{ github.token }}

      - name: Re-certify exact historical binary 40-man membership
        run: python scripts/audit_playing_time_historical_40man_membership.py

      - name: Materialize pre-model MLB PA targets
        run: >-
          python scripts/materialize_playing_time_v1_target_surface.py
          --development-evidence-root inputs/development-evidence
          --snapshot-root inputs/current-talent-snapshots

      - name: Materialize pre-model predictor candidates
        run: >-
          python scripts/materialize_playing_time_v1_predictor_surface.py
          --evidence-root seeded
          --snapshot-root inputs/current-talent-snapshots
          --membership-root reports/generated/playing-time-historical-40man-membership

      - name: Run frozen 2022-only candidate selection
        run: >-
          python scripts/materialize_playing_time_v1_candidate_selection.py
          --predictor-root reports/generated/playing-time-v1-predictor-surface
          --target-root reports/generated/playing-time-v1-target-surface

      - name: Pin selection workflow/source metadata into report
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/generated/playing-time-v1-candidate-selection/report.json')
          data = json.loads(path.read_text())
          data['source_run_id'] = int(os.environ['SOURCE_RUN_ID'])
          data['source_sha'] = os.environ['SOURCE_SHA']
          data['source_inputs'] = {
              'development_evidence_run': 32097702869,
              'frozen_b2_snapshot_run': 32099733186,
              'historical_40man_membership_recertified_in_same_run': True,
          }
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload playing-time selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playing-time-v1-candidate-selection
          path: |
            reports/generated/playing-time-v1-candidate-selection/
            reports/generated/playing-time-v1-target-surface/
            reports/generated/playing-time-v1-predictor-surface/
            reports/generated/playing-time-historical-40man-membership/
            data/quarantine/playing-time-historical-40man-membership/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist binding 2022 selection result
        run: |
          set -euo pipefail
          cp reports/generated/playing-time-v1-candidate-selection/report.json docs/playing-time-v1-selection-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/playing-time-v1-selection-result.json
          git commit -m "Persist playing-time v1 2022 selection result"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
