# persist frozen 2023 validation result on completion
name: Projection batting v1 2023 validation

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify frozen validation implementation before artifact downloads
        run: >-
          python -m py_compile
          scripts/materialize_projection_batting_v1_validation_2023.py
          src/universal_baseball/projection_ridge.py
          src/universal_baseball/projection_training.py
          src/universal_baseball/projection_selection.py
          && python -m pytest -q
          tests/test_projection_ridge.py
          tests/test_projection_training.py
          tests/test_projection_selection.py

      - name: Download immutable training responses
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-training-responses
          path: inputs/training-responses
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32100142102
          github-token: ${{ github.token }}

      - name: Download immutable development targets
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-development-evidence
          path: inputs/development-evidence
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32097702869
          github-token: ${{ github.token }}

      - name: Download immutable frozen B2 snapshots
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-current-talent-snapshots
          path: inputs/current-talent-snapshots
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32099733186
          github-token: ${{ github.token }}

      - name: Run fixed 2023 out-of-time validation
        run: >-
          python scripts/materialize_projection_batting_v1_validation_2023.py
          --training-responses-root inputs/training-responses
          --development-evidence-root inputs/development-evidence
          --snapshot-root inputs/current-talent-snapshots

      - name: Persist binding 2023 validation result
        run: |
          set -euo pipefail
          cp reports/generated/projection-batting-v1-validation-2023/report.json docs/projection-batting-v1-validation-2023-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/projection-batting-v1-validation-2023-result.json
          git commit -m "Persist Projection v1 2023 validation result"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload 2023 Projection validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: projection-batting-v1-validation-2023
          path: reports/generated/projection-batting-v1-validation-2023/
          if-no-files-found: warn
          retention-days: 14
