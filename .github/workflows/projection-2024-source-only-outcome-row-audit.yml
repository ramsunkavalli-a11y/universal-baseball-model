name: Projection 2024 source-only outcome-row audit

on:
  push:
    branches: [source-certification-poc]
    paths:
      - "scripts/audit_projection_2024_source_only_outcome_rows.py"
      - ".github/workflows/projection-2024-source-only-outcome-row-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m py_compile scripts/audit_projection_2024_source_only_outcome_rows.py
      - name: Run source-only residual audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_projection_2024_source_only_outcome_rows.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: projection-2024-source-only-outcome-row-audit
          path: reports/generated/projection-2024-source-only-outcome-row-audit/
          if-no-files-found: warn
          retention-days: 14
