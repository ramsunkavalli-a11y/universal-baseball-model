name: Current Talent development selection checkpoint

on:
  # One-time self-documenting run; restore/remove after the checkpoint is committed.
  push:
    branches:
      - source-certification-poc
    paths:
      - .github/workflows/current-talent-baseline-selection-persist.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - season: "2021"
            milb_source_run_id: "31980820797"
            milb_artifact_pattern: "ct-validation-game-evidence-2021-*"
            mlb_source_run_id: "31986504169"
          - season: "2022"
            milb_source_run_id: "31971662070"
            milb_artifact_pattern: "current-talent-historical-milb-full-season-*"
            mlb_source_run_id: "31988255280"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run selection and baseline regression tests
        run: >-
          python -m pytest
          tests/test_current_talent_selection.py
          tests/test_current_talent_calibration.py
          tests/test_current_talent_ablation.py
          tests/test_current_talent_baselines.py
          tests/test_current_talent_scoring.py
          tests/test_current_talent_score_diagnostics.py
          tests/test_current_talent_translation.py
          tests/test_chadwick.py
      - name: Download certified MiLB evidence
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.milb_artifact_pattern }}
          path: reports/generated/current-talent-selection-inputs/${{ matrix.season }}/milb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: ${{ matrix.milb_source_run_id }}
          github-token: ${{ github.token }}
      - name: Download certified MLB evidence
        uses: actions/download-artifact@v8
        with:
          name: current-talent-historical-mlb-${{ matrix.season }}
          path: reports/generated/current-talent-selection-inputs/${{ matrix.season }}/mlb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: ${{ matrix.mlb_source_run_id }}
          github-token: ${{ github.token }}
      - name: Evaluate predeclared season grid
        run: >-
          python scripts/materialize_current_talent_selection_grid.py
          --input-root "reports/generated/current-talent-selection-inputs/${{ matrix.season }}/milb"
          --mlb-input-root "reports/generated/current-talent-selection-inputs/${{ matrix.season }}/mlb"
          --season "${{ matrix.season }}"
          --output-dir "reports/generated/current-talent-selection-grid/${{ matrix.season }}"
      - name: Upload season development grid
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-development-selection-season-${{ matrix.season }}
          path: reports/generated/current-talent-selection-grid/${{ matrix.season }}/
          if-no-files-found: error
          retention-days: 14

  select_and_persist:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: source-certification-poc
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Download 2021-2022 development grids
        uses: actions/download-artifact@v8
        with:
          pattern: current-talent-development-selection-season-*
          path: reports/generated/current-talent-development-selection-inputs
      - name: Rank predeclared candidates
        run: >-
          python scripts/summarize_current_talent_selection_grid.py
          --input-root reports/generated/current-talent-development-selection-inputs
          --output-dir reports/generated/current-talent-development-selection-summary
      - name: Sync branch before documentation checkpoint
        run: git pull --ff-only origin source-certification-poc
      - name: Persist pre-confirmation selection checkpoint
        run: >-
          python scripts/persist_current_talent_selection_checkpoint.py
          --selection-dir reports/generated/current-talent-development-selection-summary
          --docs-dir docs
          --project-status docs/project-status.md
      - name: Commit selection checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/project-status.md \
            docs/current-talent-development-selection-checkpoint.md \
            docs/current-talent-development-selected-candidate.json \
            docs/current-talent-development-ranked-candidates.csv
          if git diff --cached --quiet; then
            echo "Selection checkpoint already matches repository state."
          else
            git commit -m "Checkpoint Current Talent development selection"
            git push origin HEAD:source-certification-poc
          fi
      - name: Upload development selection summary
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-development-selection-summary
          path: reports/generated/current-talent-development-selection-summary/
          if-no-files-found: error
          retention-days: 14
