name: Projection v1 validation contracts CI

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - "src/universal_baseball/projection_validation.py"
      - "src/universal_baseball/projection_baselines.py"
      - "src/universal_baseball/projection_dataset.py"
      - "src/universal_baseball/projection_composition.py"
      - "src/universal_baseball/projection_current_talent.py"
      - "src/universal_baseball/current_talent_universal_evidence.py"
      - "src/universal_baseball/current_talent_official_game_fallback.py"
      - "src/universal_baseball/current_talent_official_game_identity.py"
      - "src/universal_baseball/current_talent_source_residual_quarantine.py"
      - "src/universal_baseball/current_talent_evidence_quarantine.py"
      - "scripts/materialize_projection_batting_v1_development_evidence.py"
      - "scripts/materialize_current_talent_historical_milb_game_evidence_with_exact_game_fallback.py"
      - "tests/test_projection_validation.py"
      - "tests/test_projection_baselines.py"
      - "tests/test_projection_dataset.py"
      - "tests/test_projection_composition.py"
      - "tests/test_projection_current_talent.py"
      - "tests/test_current_talent_universal_evidence.py"
      - "tests/test_current_talent_official_game_fallback.py"
      - "tests/test_current_talent_official_game_identity.py"
      - "tests/test_current_talent_source_residual_quarantine.py"
      - "tests/test_current_talent_evidence_quarantine.py"
      - ".github/workflows/projection-validation-contracts-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Projection and source-authority contracts
        run: >-
          python -m py_compile
          src/universal_baseball/projection_validation.py
          src/universal_baseball/projection_baselines.py
          src/universal_baseball/projection_dataset.py
          src/universal_baseball/projection_composition.py
          src/universal_baseball/projection_current_talent.py
          src/universal_baseball/current_talent_universal_evidence.py
          src/universal_baseball/current_talent_official_game_fallback.py
          src/universal_baseball/current_talent_official_game_identity.py
          src/universal_baseball/current_talent_source_residual_quarantine.py
          src/universal_baseball/current_talent_evidence_quarantine.py
          scripts/materialize_projection_batting_v1_development_evidence.py
          scripts/materialize_current_talent_historical_milb_game_evidence_with_exact_game_fallback.py

      - name: Test Projection and source-authority contracts
        run: >-
          python -m pytest -q
          tests/test_projection_validation.py
          tests/test_projection_baselines.py
          tests/test_projection_dataset.py
          tests/test_projection_composition.py
          tests/test_projection_current_talent.py
          tests/test_current_talent_universal_evidence.py
          tests/test_current_talent_official_game_fallback.py
          tests/test_current_talent_official_game_identity.py
          tests/test_current_talent_source_residual_quarantine.py
          tests/test_current_talent_evidence_quarantine.py
