name: Projection v1 validation contracts CI

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - "src/universal_baseball/projection_validation.py"
      - "src/universal_baseball/projection_baselines.py"
      - "src/universal_baseball/projection_dataset.py"
      - "scripts/materialize_projection_batting_v1_development_evidence.py"
      - "tests/test_projection_validation.py"
      - "tests/test_projection_baselines.py"
      - "tests/test_projection_dataset.py"
      - ".github/workflows/projection-validation-contracts-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Projection v1 contracts and evidence materializer
        run: >-
          python -m py_compile
          src/universal_baseball/projection_validation.py
          src/universal_baseball/projection_baselines.py
          src/universal_baseball/projection_dataset.py
          scripts/materialize_projection_batting_v1_development_evidence.py

      - name: Test Projection chronology, dataset, carry-forward baseline, and 2025 quarantine
        run: >-
          python -m pytest -q
          tests/test_projection_validation.py
          tests/test_projection_baselines.py
          tests/test_projection_dataset.py
