name: Identity source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chadwick-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit pinned Chadwick coverage for AAA, DSL, and FCL player IDs
        run: python scripts/audit_chadwick_identity.py

      - name: Upload identity audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chadwick-identity-coverage
          path: reports/generated/identity/
          if-no-files-found: warn
          retention-days: 14
