name: Current Talent 2021 Rookie raw PBP sequence

on:
  workflow_dispatch:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/current-talent-2021-rk-raw-sequence.yml"
      - "scripts/diagnose_raw_2021_rk_pbp_sequence.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Capture raw uncovered PBP sequence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/diagnose_raw_2021_rk_pbp_sequence.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-2021-rk-raw-pbp-sequence
          path: reports/generated/current-talent-2021-rk-contact-sequence-diagnostic/raw_missing_sequence*.json
          if-no-files-found: warn
          retention-days: 14
