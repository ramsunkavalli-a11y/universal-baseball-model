name: Current Talent contact-value source materialization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    name: ${{ matrix.season }} ${{ matrix.level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - season: 2021
            level: aaa
            slug: aaa
          - season: 2021
            level: aa
            slug: aa
          - season: 2021
            level: a+
            slug: aplus
          - season: 2021
            level: a
            slug: a
          - season: 2021
            level: rk
            slug: rk
          - season: 2022
            level: aaa
            slug: aaa
          - season: 2022
            level: aa
            slug: aa
          - season: 2022
            level: a+
            slug: aplus
          - season: 2022
            level: a
            slug: a
          - season: 2022
            level: rk
            slug: rk

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile source materialization gate
        run: python -m py_compile scripts/materialize_current_talent_contact_value_source.py

      - name: Materialize source-only target contacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/materialize_current_talent_contact_value_source.py
          --season ${{ matrix.season }}
          --level '${{ matrix.level }}'

      - name: Upload source materialization report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: current-talent-contact-value-source-${{ matrix.season }}-${{ matrix.slug }}
          path: reports/generated/current-talent-contact-value-source-materialization/${{ matrix.season }}/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14
