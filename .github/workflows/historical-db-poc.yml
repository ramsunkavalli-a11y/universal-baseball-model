name: Multi-asset historical DB POC

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/historical-db-poc.yml"
      - "scripts/build_multi_asset_historical_db_poc.py"

permissions:
  contents: read

jobs:
  historical-db-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Build multi-asset historical DB POC
        run: python scripts/build_multi_asset_historical_db_poc.py

      - name: Upload POC report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-db-poc
          path: reports/generated/historical-db-poc/
          if-no-files-found: warn
          retention-days: 14
