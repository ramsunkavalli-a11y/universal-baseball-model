name: Player Value v1 MLB centering membership 2024

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Download pinned Playing Time 2024 validation artifact
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upstream/playing-time
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9326300207/zip" \
            > upstream/playing-time.zip
          unzip -q upstream/playing-time.zip -d upstream/playing-time
          test -f upstream/playing-time/tables/candidate_2024_scored.parquet

      - name: Materialize fixed reference membership
        id: materialize
        env:
          MATERIALIZATION_RUN_ID: ${{ github.run_id }}
          MATERIALIZATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/materialize_player_value_v1_mlb_centering_membership_2024.py \
            --playing-time-scored upstream/playing-time/tables/candidate_2024_scored.parquet \
            --output-membership-parquet reports/generated/player-value-v1-mlb-centering-2024-membership.parquet \
            --output-summary-json docs/player-value-v1-mlb-centering-2024-membership.json \
            --playing-time-run-id 32142089669 \
            --playing-time-artifact-id 9326300207 \
            --playing-time-artifact-digest sha256:979386377b5c2fa7f8f411bcd3284c6f4e68d532a5585e002b493f3cfffe0366 \
            --playing-time-source-sha 3bc9825c74e060fc8ced07b2f2accd6bbcaeb151 \
            --materialization-run-id "$MATERIALIZATION_RUN_ID" \
            --materialization-source-sha "$MATERIALIZATION_SOURCE_SHA"

      - name: Upload fixed reference membership artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: player-value-v1-mlb-centering-2024-membership
          path: |
            reports/generated/player-value-v1-mlb-centering-2024-membership.parquet
            docs/player-value-v1-mlb-centering-2024-membership.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist run record and verified summary
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          summary_exists = Path('docs/player-value-v1-mlb-centering-2024-membership.json').exists()
          record = {
              'schema_version': '0.1',
              'status': 'player_value_v1_mlb_centering_2024_membership_run',
              'run_id': int(os.environ['RUN_ID']),
              'source_sha': os.environ['SOURCE_SHA'],
              'steps': {
                  'download': os.environ.get('DOWNLOAD_OUTCOME', ''),
                  'materialize': os.environ.get('MATERIALIZE_OUTCOME', ''),
                  'upload': os.environ.get('UPLOAD_OUTCOME', ''),
              },
              'verified_summary_present': summary_exists,
          }
          Path('docs/player-value-v1-mlb-centering-2024-membership-run.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-mlb-centering-2024-membership-run.json
          if test -f docs/player-value-v1-mlb-centering-2024-membership.json; then
            git add docs/player-value-v1-mlb-centering-2024-membership.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 2024 MLB centering membership run"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
