name: Player Value v1 MLB centering membership 2024

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/player-value-v1-mlb-centering-membership-2024.yml"
      - "scripts/materialize_player_value_v1_mlb_centering_membership_2024.py"
      - "src/universal_baseball/player_value_mlb_centering_assembly.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Download frozen Playing Time 2024 validation artifact
        uses: actions/download-artifact@v4
        with:
          name: playing-time-v1-validation-2024
          path: upstream/playing-time
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32142089669

      - name: Materialize fixed reference membership
        env:
          MATERIALIZATION_RUN_ID: ${{ github.run_id }}
          MATERIALIZATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f upstream/playing-time/tables/candidate_2024_scored.parquet
          python scripts/materialize_player_value_v1_mlb_centering_membership_2024.py \
            --playing-time-scored upstream/playing-time/tables/candidate_2024_scored.parquet \
            --output-membership-parquet reports/generated/player-value-v1-mlb-centering-2024-membership.parquet \
            --output-summary-json docs/player-value-v1-mlb-centering-2024-membership.json \
            --playing-time-run-id 32142089669 \
            --playing-time-artifact-id 9326300207 \
            --playing-time-artifact-digest sha256:979386377b5c2fa7f8f411bcd3284c6f4e68d532a5585e002b493f3cfffe0366 \
            --playing-time-source-sha 3bc9825c74e060fc8ced07b2f2accd6bbcaeb151 \
            --materialization-run-id "$MATERIALIZATION_RUN_ID" \
            --materialization-source-sha "$MATERIALIZATION_SOURCE_SHA"

      - name: Upload fixed reference membership artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-value-v1-mlb-centering-2024-membership
          path: |
            reports/generated/player-value-v1-mlb-centering-2024-membership.parquet
            docs/player-value-v1-mlb-centering-2024-membership.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist verified membership summary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-mlb-centering-2024-membership.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify 2024 MLB centering membership"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
