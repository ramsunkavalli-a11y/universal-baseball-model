name: Player Value v1 defensive position allocation

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify frozen allocation implementation
        run: >-
          python -m py_compile scripts/diagnose_player_value_v1_defensive_position_allocation.py

      - name: Download exact immutable upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/position-role inputs/fielding
          gh run download 32152125644 \
            --repo ramsunkavalli-a11y/universal-baseball-model \
            --name position-role-transition-challenger-development \
            --dir inputs/position-role
          gh run download 32148467330 \
            --repo ramsunkavalli-a11y/universal-baseball-model \
            --name position-role-historical-source-2021-2024 \
            --dir inputs/fielding

      - name: Run predeclared defensive position-allocation selection
        run: >-
          python scripts/diagnose_player_value_v1_defensive_position_allocation.py
          --position-role-root inputs/position-role
          --fielding-root inputs/fielding

      - name: Pin workflow metadata
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/generated/player-value-v1-defensive-position-allocation/report.json')
          data = json.loads(path.read_text())
          data['source_run_id'] = int(os.environ['SOURCE_RUN_ID'])
          data['source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload allocation artifact
        uses: actions/upload-artifact@v7
        with:
          name: player-value-v1-defensive-position-allocation
          path: reports/generated/player-value-v1-defensive-position-allocation/
          if-no-files-found: error
          retention-days: 30

      - name: Persist binding allocation result
        run: |
          set -euo pipefail
          cp reports/generated/player-value-v1-defensive-position-allocation/report.json \
            docs/player-value-v1-defensive-position-allocation-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-defensive-position-allocation-result.json
          git commit -m "Persist defensive position allocation result"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
