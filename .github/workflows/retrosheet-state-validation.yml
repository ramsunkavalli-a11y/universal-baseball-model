name: Retrosheet state validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/retrosheet-state-validation.yml"
      - "scripts/audit_retrosheet_state_validation.py"
      - "src/universal_baseball/state_transitions_v2.py"

permissions:
  contents: read

jobs:
  validate-retrosheet-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Validate state replay against Retrosheet
        run: python scripts/audit_retrosheet_state_validation.py

      - name: Upload Retrosheet validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrosheet-state-validation
          path: reports/generated/retrosheet-state-validation/
          if-no-files-found: warn
          retention-days: 14
