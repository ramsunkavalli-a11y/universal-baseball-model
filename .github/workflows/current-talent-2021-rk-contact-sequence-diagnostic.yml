name: Current Talent 2021 Rookie contact sequence diagnostic

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run relevant unit tests
        run: >-
          python -m pytest
          tests/test_current_talent_identity_corrections.py
          tests/test_current_talent_participant_authority.py

      - name: Diagnose contact sequence coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/diagnose_current_talent_2021_rk_contact_sequence_coverage.py

      - name: Capture raw uncovered PBP sequence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/diagnose_raw_2021_rk_pbp_sequence.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-2021-rk-contact-sequence-diagnostic
          path: reports/generated/current-talent-2021-rk-contact-sequence-diagnostic/
          if-no-files-found: warn
          retention-days: 14
