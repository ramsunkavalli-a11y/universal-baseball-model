name: Source certification smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armstjc-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Profile small quarantined armstjc release sample
        run: python scripts/certify_armstjc_release.py

      - name: Audit batted-ball evidence on the same source file
        run: |
          python scripts/certify_armstjc_batted_ball.py \
            --input-file "data/quarantine/armstjc/2025_3_aaa_pbp.csv" \
            --sample-games 5 \
            --report-dir "reports/generated/armstjc"

      - name: Upload certification reports only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: armstjc-release-smoke-report
          path: reports/generated/armstjc/
          if-no-files-found: error
          retention-days: 14
