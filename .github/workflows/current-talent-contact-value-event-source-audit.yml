name: Current Talent contact-value event-source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile reusable event-source audit
        run: python -m py_compile scripts/audit_current_talent_contact_value_event_source.py

      - name: Audit 2021-22 reusable structured terminal events
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_current_talent_contact_value_event_source.py

      - name: Upload reusable event-source audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-event-source
          path: reports/generated/current-talent-contact-value-event-source/
          if-no-files-found: warn
          retention-days: 14
