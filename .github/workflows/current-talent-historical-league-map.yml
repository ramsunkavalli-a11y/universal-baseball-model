name: Current Talent historical league map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run historical planning tests
        run: python -m pytest tests/test_current_talent_history.py

      - name: Audit historical actual-league mapping
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_current_talent_historical_league_map.py

      - name: Upload historical league-map audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-historical-league-map
          path: reports/generated/current-talent-historical-league-map/
          if-no-files-found: warn
          retention-days: 14
