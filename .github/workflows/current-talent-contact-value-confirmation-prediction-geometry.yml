name: Current Talent contact-value 2023 confirmation prediction geometry

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Require accepted pre-scoring confirmation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("docs/current-talent-contact-value-confirmation-evidence-result.json").read_text())
          features = json.loads(Path("docs/current-talent-contact-value-confirmation-features-result.json").read_text())
          refit = json.loads(Path("docs/current-talent-contact-value-confirmation-refit-result.json").read_text())
          if evidence.get("gate") != "current_talent_contact_value_confirmation_evidence_pre_scoring":
              raise SystemExit("confirmation evidence gate not accepted")
          if features.get("gate") != "current_talent_contact_value_confirmation_features_pre_scoring":
              raise SystemExit("confirmation feature gate not accepted")
          if refit.get("gate") != "current_talent_contact_value_confirmation_refit_2021_2022":
              raise SystemExit("confirmation refit gate not accepted")
          if evidence.get("boundary", {}).get("model_scoring") is not False:
              raise SystemExit("evidence already scored")
          if features.get("boundary", {}).get("model_scoring") is not False:
              raise SystemExit("features already scored")
          if refit.get("boundary", {}).get("accessed_2023") is not False:
              raise SystemExit("frozen confirmation refit accessed 2023")
          PY

      - name: Compile confirmation prediction geometry
        run: python -m py_compile scripts/materialize_current_talent_contact_value_confirmation_prediction_geometry.py

      - name: Download accepted confirmation evidence
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-confirmation-evidence
          path: seeded/evidence
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32086538491
          github-token: ${{ github.token }}

      - name: Download accepted confirmation features
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-confirmation-features
          path: seeded/features
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32086704821
          github-token: ${{ github.token }}

      - name: Materialize finite 2023 predictions without scoring
        run: >-
          python scripts/materialize_current_talent_contact_value_confirmation_prediction_geometry.py
          --evidence-root seeded/evidence
          --feature-root seeded/features
          --confirmation-refit docs/current-talent-contact-value-confirmation-refit-result.json

      - name: Upload confirmation prediction geometry artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-confirmation-prediction-geometry
          path: reports/generated/current-talent-contact-value-confirmation-prediction-geometry/
          if-no-files-found: warn
          retention-days: 14
