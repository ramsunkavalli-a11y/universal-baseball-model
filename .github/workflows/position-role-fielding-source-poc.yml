name: Position-role 2024 fielding source POC

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/position-role-fielding-source-poc.yml"
      - "scripts/audit_position_role_fielding_source_poc.py"
      - "docs/position-role-coherence-readiness.md"
      - "docs/position-role-fielding-source-poc-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify source POC code
        run: >-
          python -m py_compile
          scripts/audit_position_role_fielding_source_poc.py
          src/universal_baseball/mlb_season_stats.py

      - name: Run 2024 representative-league fielding audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/audit_position_role_fielding_source_poc.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload source captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: position-role-fielding-source-poc-2024
          path: |
            reports/generated/position-role-fielding-source-poc/
            data/quarantine/position-role-fielding-source-poc/
          if-no-files-found: error
          retention-days: 30

      - name: Persist binding POC result
        if: always()
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('reports/generated/position-role-fielding-source-poc/report.json')
          if not source.exists():
              raise SystemExit('fielding source POC report was not produced')
          result = json.loads(source.read_text())
          result['source_run_id'] = int(os.environ['SOURCE_RUN_ID'])
          result['source_sha'] = os.environ['SOURCE_SHA']
          Path('docs/position-role-fielding-source-poc-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/position-role-fielding-source-poc-result.json
          git commit -m "Persist 2024 position-role fielding source POC"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce fail-closed POC decision
        if: always()
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          test "${AUDIT_EXIT_CODE:-1}" -eq 0
