name: Current Talent age coverage audit

on:
  workflow_dispatch:
    inputs:
      milb_source_run_id:
        description: Run containing five certified MiLB player-game artifacts
        required: true
        default: "31980820797"
        type: string
      milb_artifact_pattern:
        description: Artifact-name glob for five MiLB levels
        required: true
        default: "ct-validation-game-evidence-2021-*"
        type: string
      mlb_source_run_id:
        description: Certified historical MLB run
        required: true
        default: "31986504169"
        type: string
      season:
        description: Season
        required: true
        default: "2021"
        type: string
      as_of_date:
        description: Training cutoff YYYY-MM-DD
        required: true
        default: "2021-08-01"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MILB_SOURCE_RUN_ID: ${{ inputs.milb_source_run_id }}
      MILB_ARTIFACT_PATTERN: ${{ inputs.milb_artifact_pattern }}
      MLB_SOURCE_RUN_ID: ${{ inputs.mlb_source_run_id }}
      TARGET_SEASON: ${{ inputs.season }}
      AS_OF_DATE: ${{ inputs.as_of_date }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run Chadwick age tests
        run: python -m pytest tests/test_chadwick.py
      - name: Download certified MiLB evidence
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.MILB_ARTIFACT_PATTERN }}
          path: reports/generated/current-talent-age-inputs/${{ env.TARGET_SEASON }}/milb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: ${{ env.MILB_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download certified MLB evidence
        uses: actions/download-artifact@v8
        with:
          name: current-talent-historical-mlb-${{ env.TARGET_SEASON }}
          path: reports/generated/current-talent-age-inputs/${{ env.TARGET_SEASON }}/mlb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: ${{ env.MLB_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Audit exact DOB coverage
        run: >-
          python scripts/audit_current_talent_age_coverage.py
          --input-root "reports/generated/current-talent-age-inputs/${TARGET_SEASON}"
          --season "${TARGET_SEASON}"
          --as-of-date "${AS_OF_DATE}"
          --output-dir "reports/generated/current-talent-age-coverage/${TARGET_SEASON}/${AS_OF_DATE}"
      - name: Upload age coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-age-coverage-${{ env.TARGET_SEASON }}-${{ env.AS_OF_DATE }}
          path: reports/generated/current-talent-age-coverage/${{ env.TARGET_SEASON }}/${{ env.AS_OF_DATE }}/
          if-no-files-found: warn
          retention-days: 14
