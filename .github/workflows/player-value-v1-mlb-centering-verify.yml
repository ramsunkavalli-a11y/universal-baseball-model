name: Player Value v1 MLB centering verify

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/player-value-v1-mlb-centering-verify.yml"
      - "src/universal_baseball/player_value_mlb_centering.py"
      - "src/universal_baseball/player_value_mlb_centering_assembly.py"
      - "scripts/materialize_player_value_v1_mlb_centering_membership_2024.py"
      - "tests/test_player_value_mlb_centering.py"
      - "tests/test_player_value_mlb_centering_assembly.py"
      - "docs/player-value-v1-mlb-centering-contract.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify centering implementation and reference assembly
        id: tests
        run: >-
          python -m py_compile
          src/universal_baseball/player_value_mlb_centering.py
          src/universal_baseball/player_value_mlb_centering_assembly.py
          scripts/materialize_player_value_v1_mlb_centering_membership_2024.py
          && python -m pytest -q
          tests/test_player_value_mlb_centering.py
          tests/test_player_value_mlb_centering_assembly.py

      - name: Download pinned Playing Time 2024 validation artifact
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upstream/playing-time
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9326300207/zip" \
            > upstream/playing-time.zip
          unzip -q upstream/playing-time.zip -d upstream/playing-time
          test -f upstream/playing-time/tables/candidate_2024_scored.parquet

      - name: Materialize fixed 2024 reference membership
        id: membership
        env:
          MATERIALIZATION_RUN_ID: ${{ github.run_id }}
          MATERIALIZATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/materialize_player_value_v1_mlb_centering_membership_2024.py \
            --playing-time-scored upstream/playing-time/tables/candidate_2024_scored.parquet \
            --output-membership-parquet reports/generated/player-value-v1-mlb-centering-2024-membership.parquet \
            --output-summary-json docs/player-value-v1-mlb-centering-2024-membership.json \
            --playing-time-run-id 32142089669 \
            --playing-time-artifact-id 9326300207 \
            --playing-time-artifact-digest sha256:979386377b5c2fa7f8f411bcd3284c6f4e68d532a5585e002b493f3cfffe0366 \
            --playing-time-source-sha 3bc9825c74e060fc8ced07b2f2accd6bbcaeb151 \
            --materialization-run-id "$MATERIALIZATION_RUN_ID" \
            --materialization-source-sha "$MATERIALIZATION_SOURCE_SHA"

      - name: Upload fixed reference membership artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: player-value-v1-mlb-centering-2024-membership
          path: |
            reports/generated/player-value-v1-mlb-centering-2024-membership.parquet
            docs/player-value-v1-mlb-centering-2024-membership.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist verification and run record
        if: always()
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          MEMBERSHIP_OUTCOME: ${{ steps.membership.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          outcomes = {
              'tests': os.environ.get('TESTS_OUTCOME', ''),
              'download': os.environ.get('DOWNLOAD_OUTCOME', ''),
              'membership': os.environ.get('MEMBERSHIP_OUTCOME', ''),
              'upload': os.environ.get('UPLOAD_OUTCOME', ''),
          }
          all_passed = all(value == 'success' for value in outcomes.values())
          membership_path = Path('docs/player-value-v1-mlb-centering-2024-membership.json')

          run_record = {
              'schema_version': '0.1',
              'status': 'player_value_v1_mlb_centering_verification_run',
              'source_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_sha': os.environ['SOURCE_SHA'],
              'steps': outcomes,
              'membership_summary_present': membership_path.exists(),
              'all_preconstant_checks_passed': all_passed,
          }
          Path('docs/player-value-v1-mlb-centering-run.json').write_text(
              json.dumps(run_record, indent=2, sort_keys=True) + '\n'
          )

          if all_passed and membership_path.exists():
              verification = {
                  'schema_version': '0.1',
                  'status': 'player_value_v1_mlb_centering_implementation_and_membership_verified',
                  'centering_id': 'fixed_2024_mlb_projected_component_reference_v1',
                  'reference_season': 2024,
                  'source_run_id': int(os.environ['SOURCE_RUN_ID']),
                  'source_sha': os.environ['SOURCE_SHA'],
                  'tests': [
                      'tests/test_player_value_mlb_centering.py',
                      'tests/test_player_value_mlb_centering_assembly.py',
                  ],
                  'boundary': {
                      'reference_membership_materialized': True,
                      'numerical_reference_materialized': False,
                      'park_adjustment_selected': False,
                      'replacement_in_centering': False,
                      'war_value_calculated': False,
                  },
              }
              Path('docs/player-value-v1-mlb-centering-verification.json').write_text(
                  json.dumps(verification, indent=2, sort_keys=True) + '\n'
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-mlb-centering-run.json
          if test -f docs/player-value-v1-mlb-centering-2024-membership.json; then
            git add docs/player-value-v1-mlb-centering-2024-membership.json
          fi
          if test -f docs/player-value-v1-mlb-centering-verification.json; then
            git add docs/player-value-v1-mlb-centering-verification.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify MLB centering membership anchor"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
