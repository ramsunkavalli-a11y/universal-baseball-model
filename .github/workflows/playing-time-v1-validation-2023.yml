name: Playing-time v1 2023 validation

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/playing-time-v1-validation-2023.yml"
      - "docs/playing-time-v1-selection-result.json"
      - "scripts/materialize_playing_time_v1_validation_2023.py"
      - "src/universal_baseball/playing_time_model.py"
      - "src/universal_baseball/playing_time_selection.py"
      - "docs/playing-time-validation-2023-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and playing-time dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install -r requirements-playing-time.txt

      - name: Verify frozen validation code
        run: >-
          python -m py_compile
          src/universal_baseball/playing_time_model.py
          src/universal_baseball/playing_time_selection.py
          scripts/materialize_playing_time_v1_validation_2023.py
          && python -m pytest -q
          tests/test_playing_time_model.py
          tests/test_playing_time_selection.py

      - name: Resolve immutable selection artifact
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/playing-time-v1-selection-result.json')
          if not path.exists():
              raise SystemExit('playing-time selection result is not yet available')
          result = json.loads(path.read_text())
          run_id = result.get('source_run_id')
          if not run_id:
              raise SystemExit('playing-time selection result lacks source_run_id')
          print(int(run_id))
          PY
          )"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          mkdir -p inputs/selection
          gh run download "$run_id" \
            --repo ramsunkavalli-a11y/universal-baseball-model \
            --name playing-time-v1-candidate-selection \
            --dir inputs/selection

      - name: Run fixed 2023 out-of-time gate
        run: >-
          python scripts/materialize_playing_time_v1_validation_2023.py
          --selection-artifact-root inputs/selection

      - name: Pin validation workflow metadata
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/generated/playing-time-v1-validation-2023/report.json')
          data = json.loads(path.read_text())
          data['source_run_id'] = int(os.environ['SOURCE_RUN_ID'])
          data['source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload 2023 validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: playing-time-v1-validation-2023
          path: reports/generated/playing-time-v1-validation-2023/
          if-no-files-found: error
          retention-days: 14

      - name: Persist binding 2023 validation result
        run: |
          set -euo pipefail
          cp reports/generated/playing-time-v1-validation-2023/report.json docs/playing-time-v1-validation-2023-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/playing-time-v1-validation-2023-result.json
          git commit -m "Persist playing-time v1 2023 validation result"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
