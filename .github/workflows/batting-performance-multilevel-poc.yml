name: Universal 2024 batting Performance artifact join

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  combine-certified-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Download certified affiliated Performance artifact
        uses: actions/download-artifact@v7
        with:
          name: affiliated-batting-performance-2024
          path: certified-inputs/affiliated
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 31948208695
          github-token: ${{ github.token }}

      - name: Download certified MLB Performance artifact
        uses: actions/download-artifact@v7
        with:
          name: mlb-batting-performance-2024
          path: certified-inputs/mlb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 31955217794
          github-token: ${{ github.token }}

      - name: Materialize universal 2024 batting Performance
        run: >-
          python scripts/materialize_universal_batting_performance.py
          --affiliated-root certified-inputs/affiliated
          --mlb-root certified-inputs/mlb

      - name: Upload universal Performance dataset
        uses: actions/upload-artifact@v7
        with:
          name: universal-batting-performance-2024
          path: reports/generated/universal-batting-performance-2024/
          if-no-files-found: error
          retention-days: 14
