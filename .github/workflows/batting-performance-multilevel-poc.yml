name: Batting Performance multilevel POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-level:
    strategy:
      fail-fast: false
      matrix:
        level: ["aa", "a+", "a", "rk"]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Build completed-level batting Performance POC
        run: python scripts/build_batting_performance_level_poc_v2.py --level '${{ matrix.level }}'

      - name: Upload level artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batting-performance-${{ matrix.level }}-2024
          path: reports/generated/batting-performance-multilevel-poc/
          if-no-files-found: warn
          retention-days: 14
