name: Current Talent Minor League Savant probe

on:
  # One-time source-capability bootstrap. Return to manual-only after the probe resolves.
  push:
    branches:
      - source-certification-poc
    paths:
      - .github/workflows/current-talent-savant-minors-probe.yml
      - scripts/probe_savant_minors_tracking.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - season: 2021
            probe_date: "2021-07-01"
            run_id: "31980820797"
            artifact_pattern: "ct-validation-game-evidence-2021-*"
          - season: 2022
            probe_date: "2022-07-01"
            run_id: "31971662070"
            artifact_pattern: "current-talent-historical-milb-full-season-*"
          - season: 2023
            probe_date: "2023-07-01"
            run_id: "31971923778"
            artifact_pattern: "current-talent-historical-milb-full-season-2023-*"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: source-certification-poc

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile source probe
        run: python -m py_compile scripts/probe_savant_minors_tracking.py

      - name: Download certified MiLB evidence
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifact_pattern }}
          path: reports/generated/current-talent-savant-minors-probe-inputs/${{ matrix.season }}/milb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}

      - name: Probe one official Minor League Savant date
        run: >-
          python scripts/probe_savant_minors_tracking.py
          --certified-milb-root reports/generated/current-talent-savant-minors-probe-inputs/${{ matrix.season }}/milb
          --probe-date ${{ matrix.probe_date }}
          --output-dir reports/generated/current-talent-savant-minors-probe/${{ matrix.season }}

      - name: Upload source probe artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-savant-minors-probe-${{ matrix.season }}
          path: reports/generated/current-talent-savant-minors-probe/${{ matrix.season }}/
          if-no-files-found: warn
          retention-days: 14
