name: Current Talent Minor League Savant probe

on:
  # Live source gate. Keep manual-only.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: source-certification-poc

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify deterministic richer-source contracts
        run: >-
          python -m pytest
          tests/test_current_talent_savant_minors.py
          tests/test_current_talent_savant_minors_capture.py
          tests/test_current_talent_batted_ball_quality.py
          tests/test_current_talent_batted_ball_standardization.py
          tests/test_current_talent_batted_ball_source_diagnostics.py
          tests/test_current_talent_batted_ball_source_audit.py
          tests/test_current_talent_batted_ball_reconciliation.py
          tests/test_current_talent_batted_ball_materialization.py
          tests/test_current_talent_batted_ball_capability.py
          tests/test_current_talent_batted_ball_scoring.py
          tests/test_current_talent_batted_ball_residual_fit.py
          tests/test_current_talent_batted_ball_development_contract.py

      - name: Compile source and development tools
        run: >-
          python -m py_compile
          scripts/probe_savant_minors_tracking.py
          scripts/capture_current_talent_savant_minors_tracking.py
          scripts/materialize_current_talent_tracked_bbe_from_raw.py
          scripts/combine_current_talent_tracked_bbe.py
          scripts/audit_current_talent_batted_ball_source_semantics.py
          scripts/materialize_current_talent_batted_ball_development.py

      - name: Download certified MiLB evidence serially with retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          download_with_retry() {
            local run_id="$1"
            local pattern="$2"
            local destination="$3"
            local attempt
            for attempt in 1 2 3 4 5; do
              rm -rf "$destination"
              mkdir -p "$destination"
              echo "Downloading run ${run_id}, pattern ${pattern}, attempt ${attempt}/5"
              if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$pattern" \
                --dir "$destination"; then
                return 0
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "Artifact download failed after 5 attempts: run=${run_id} pattern=${pattern}" >&2
                return 1
              fi
              sleep $((attempt * 15))
            done
          }

          download_with_retry \
            31980820797 \
            'ct-validation-game-evidence-2021-*' \
            'reports/generated/current-talent-savant-minors-probe-inputs/2021/milb'

          download_with_retry \
            31971662070 \
            'current-talent-historical-milb-full-season-*' \
            'reports/generated/current-talent-savant-minors-probe-inputs/2022/milb'

          download_with_retry \
            31971923778 \
            'current-talent-historical-milb-full-season-2023-*' \
            'reports/generated/current-talent-savant-minors-probe-inputs/2023/milb'

      - name: Probe 2021 official Minor League Savant date
        run: >-
          python scripts/probe_savant_minors_tracking.py
          --certified-milb-root reports/generated/current-talent-savant-minors-probe-inputs/2021/milb
          --probe-date 2021-07-01
          --output-dir reports/generated/current-talent-savant-minors-probe/2021

      - name: Probe 2022 official Minor League Savant date
        run: >-
          python scripts/probe_savant_minors_tracking.py
          --certified-milb-root reports/generated/current-talent-savant-minors-probe-inputs/2022/milb
          --probe-date 2022-07-01
          --output-dir reports/generated/current-talent-savant-minors-probe/2022

      - name: Probe 2023 official Minor League Savant date
        run: >-
          python scripts/probe_savant_minors_tracking.py
          --certified-milb-root reports/generated/current-talent-savant-minors-probe-inputs/2023/milb
          --probe-date 2023-07-01
          --output-dir reports/generated/current-talent-savant-minors-probe/2023

      - name: Upload combined source probe artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-savant-minors-probe-all
          path: reports/generated/current-talent-savant-minors-probe/
          if-no-files-found: warn
          retention-days: 14
