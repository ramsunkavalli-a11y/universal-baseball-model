name: MLB Savant Performance source audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mlb-savant-performance-source.yml"
      - "scripts/audit_mlb_savant_performance_source.py"
      - "src/universal_baseball/savant.py"
      - "tests/test_savant.py"
      - "src/universal_baseball/official.py"
      - "src/universal_baseball/contact_identity_overlay.py"
      - "src/universal_baseball/performance_events.py"

permissions:
  contents: read

jobs:
  certify-2024-mlb-savant:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Certify Baseball Savant Performance source
        run: python scripts/audit_mlb_savant_performance_source.py

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-savant-performance-source
          path: reports/generated/mlb-savant-performance-source/
          if-no-files-found: warn
          retention-days: 14
