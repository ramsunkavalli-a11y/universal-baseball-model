# retrigger exact duplicate diagnostic; no diagnostic-contract change
name: Playing-time roster duplicate diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify diagnostic script
        run: python -m py_compile scripts/diagnose_playing_time_roster_duplicates.py

      - name: Run exact duplicate diagnostic
        run: python scripts/diagnose_playing_time_roster_duplicates.py

      - name: Upload diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: playing-time-roster-duplicate-diagnostic
          path: reports/generated/playing-time-roster-duplicate-diagnostic/
          if-no-files-found: error
          retention-days: 14

      - name: Persist duplicate diagnostic result
        run: |
          set -euo pipefail
          cp reports/generated/playing-time-roster-duplicate-diagnostic/report.json docs/playing-time-roster-duplicate-diagnostic-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/playing-time-roster-duplicate-diagnostic-result.json
          git commit -m "Persist playing-time roster duplicate diagnostic"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
