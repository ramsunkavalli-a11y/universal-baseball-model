name: Player Value v1 Defense native-scale audit

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    name: audit frozen pre-2025 Defense native target scales
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Download frozen pre-2025 Defense parameter artifact
        uses: actions/download-artifact@v8
        with:
          name: defense-v1-pre-2025-parameter-freeze
          path: inputs/defense-freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32198603779

      - name: Verify audit script compiles
        run: python -m py_compile scripts/audit_player_value_v1_defense_native_scale.py

      - name: Audit native target scales without 2025 data
        run: >-
          python -u scripts/audit_player_value_v1_defense_native_scale.py
          --freeze-root inputs/defense-freeze
          --output-json reports/generated/player-value-v1-defense-native-scale-audit/result.json
          --output-md reports/generated/player-value-v1-defense-native-scale-audit/report.md

      - name: Upload audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: player-value-v1-defense-native-scale-audit
          path: reports/generated/player-value-v1-defense-native-scale-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Persist audit results
        run: |
          set -euo pipefail
          cp reports/generated/player-value-v1-defense-native-scale-audit/result.json docs/player-value-v1-defense-native-scale-audit.json
          cp reports/generated/player-value-v1-defense-native-scale-audit/report.md docs/player-value-v1-defense-native-scale-audit.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-defense-native-scale-audit.json docs/player-value-v1-defense-native-scale-audit.md
          git commit -m "Persist Player Value defense native-scale audit"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
