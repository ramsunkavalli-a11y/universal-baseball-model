name: Historical Performance mapping audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-historical-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit historical Performance mapping
        run: python scripts/audit_historical_performance_mapping.py

      - name: Upload historical Performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-performance-audit
          path: reports/generated/historical-performance-audit/
          if-no-files-found: warn
          retention-days: 14
