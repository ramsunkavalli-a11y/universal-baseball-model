name: Player Value v1 advancement selection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify advancement selection code
        run: >-
          python -m py_compile
          src/universal_baseball/player_value_baserunning_sources.py
          src/universal_baseball/player_value_advancement_projection.py
          scripts/select_player_value_v1_advancement_projection.py
          && python -m pytest -q
          tests/test_player_value_baserunning_sources.py
          tests/test_player_value_advancement_projection.py

      - name: Run advancement selection and held-out confirmation
        run: >-
          python scripts/select_player_value_v1_advancement_projection.py
          --source-audit docs/player-value-v1-baserunning-source-audit-result.json
          --output docs/player-value-v1-advancement-projection-selection-result.json

      - name: Persist advancement selection result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-advancement-projection-selection-result.json
          if git diff --cached --quiet; then
            echo "Advancement selection result unchanged; validation succeeded."
            exit 0
          fi
          git commit -m "Materialize advancement projection selection"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
