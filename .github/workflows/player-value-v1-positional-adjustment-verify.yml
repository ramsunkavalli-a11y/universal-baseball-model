name: Player Value v1 positional adjustment verify

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/player-value-v1-positional-adjustment-verify.yml"
      - "src/universal_baseball/player_value_positional_adjustment.py"
      - "tests/test_player_value_positional_adjustment.py"
      - "docs/player-value-v1-positional-adjustment-contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify positional-adjustment implementation
        run: >-
          python -m py_compile src/universal_baseball/player_value_positional_adjustment.py
          && python -m pytest -q tests/test_player_value_positional_adjustment.py
