name: Missing batted-ball event diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/missing-batted-ball-diagnostic.yml"
      - "scripts/diagnose_missing_batted_ball_events.py"

permissions:
  contents: read

jobs:
  diagnose-batted-ball-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Diagnose missing batted-ball events
        run: python scripts/diagnose_missing_batted_ball_events.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: missing-batted-ball-diagnostic
          path: reports/generated/missing-batted-ball-diagnostic/
          if-no-files-found: warn
          retention-days: 14
