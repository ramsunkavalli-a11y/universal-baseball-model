name: Defense v1 framing 2025 target source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    name: materialize untouched 2025 framing target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify freeze and 2024 predictor prerequisites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          params = json.loads(Path("docs/defense-v1-framing-repair-parameters.json").read_text())
          predictor = json.loads(Path("docs/defense-v1-2024-framing-predictor-source-result.json").read_text())
          if params.get("parameter_hash") != "sha256:e75ebd58d868b6cb6d51f2d0e48d49c1735a4cfa80661b6280269311a7875086":
              raise SystemExit("framing parameter hash changed")
          if params.get("decision", {}).get("repaired_pre_2025_framing_parameters_frozen") is not True:
              raise SystemExit("framing parameters are not frozen")
          if params.get("boundary", {}).get("2025_framing_target_accessed") is not False:
              raise SystemExit("parameter freeze crossed 2025 target boundary")
          if predictor.get("status") != "source_materialized":
              raise SystemExit("2024 framing predictor source is not certified")
          if predictor.get("decision", {}).get("2024_mlb_framing_confirmation_predictor_materialized") is not True:
              raise SystemExit("2024 framing predictor did not materialize")
          if predictor.get("decision", {}).get("2025_framing_target_materialization_authorized_next") is not True:
              raise SystemExit("2024 framing predictor did not authorize target access")
          boundary = predictor.get("boundary", {})
          if boundary.get("2025_source_accessed") is not False or boundary.get("2025_framing_target_accessed") is not False:
              raise SystemExit("2024 framing predictor crossed 2025 boundary")
          if boundary.get("model_fit") is not False or boundary.get("model_scoring_performed") is not False:
              raise SystemExit("2024 framing predictor source was not source-only")
          print("2025 framing target prerequisites verified")
          PY

      - name: Verify target materializer compiles
        run: python -m py_compile scripts/materialize_defense_v1_framing_2025_target.py

      - name: Materialize untouched 2025 framing target
        run: >-
          python -u scripts/materialize_defense_v1_framing_2025_target.py
          --output-root reports/generated/defense-v1-framing-2025-target-source

      - name: Pin source metadata
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("reports/generated/defense-v1-framing-2025-target-source/report.json")
          result = json.loads(path.read_text())
          result["source_run_id"] = int(os.environ["SOURCE_RUN_ID"])
          result["source_sha"] = os.environ["SOURCE_SHA"]
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload 2025 framing target source
        uses: actions/upload-artifact@v7
        with:
          name: defense-v1-framing-2025-target-source
          path: reports/generated/defense-v1-framing-2025-target-source/
          if-no-files-found: error
          retention-days: 30

      - name: Persist binding 2025 framing target result
        run: |
          set -euo pipefail
          cp reports/generated/defense-v1-framing-2025-target-source/report.json docs/defense-v1-framing-2025-target-source-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-framing-2025-target-source-result.json
          git commit -m "Persist Defense v1 2025 framing target source"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1