name: MiLB bin value stability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit bin-value stability
        run: python scripts/audit_milb_bin_value_stability.py --max-games-per-league 45

      - name: Upload stability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: milb-bin-value-stability
          path: reports/generated/milb-bin-value-stability/
          if-no-files-found: warn
          retention-days: 14
