name: Player Value v1 Defense native run-rate calibration

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and frozen general-target transport
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install "sportsdataverse==0.0.75"

      - name: Verify calibration implementation
        run: python -m py_compile scripts/audit_player_value_v1_defense_native_run_rate_calibration.py

      - name: Download exact certified fielding artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/fielding
          gh run download 32148467330 \
            --repo ramsunkavalli-a11y/universal-baseball-model \
            --name position-role-historical-source-2021-2024 \
            --dir inputs/fielding

      - name: Run pre-2025 native run-rate calibration diagnostic
        run: >-
          python scripts/audit_player_value_v1_defense_native_run_rate_calibration.py
          --fielding-root inputs/fielding

      - name: Pin workflow metadata
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/generated/player-value-v1-defense-native-run-rate-calibration/report.json')
          data = json.loads(path.read_text())
          data['source_run_id'] = int(os.environ['SOURCE_RUN_ID'])
          data['source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload calibration artifact
        uses: actions/upload-artifact@v7
        with:
          name: player-value-v1-defense-native-run-rate-calibration
          path: reports/generated/player-value-v1-defense-native-run-rate-calibration/
          if-no-files-found: error
          retention-days: 30

      - name: Persist diagnostic result
        run: |
          set -euo pipefail
          cp reports/generated/player-value-v1-defense-native-run-rate-calibration/report.json \
            docs/player-value-v1-defense-native-run-rate-calibration-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-defense-native-run-rate-calibration-result.json
          git commit -m "Persist Defense native run-rate calibration"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
