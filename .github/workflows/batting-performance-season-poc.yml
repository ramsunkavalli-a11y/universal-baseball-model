name: Batting Performance season POC

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/batting-performance-season-poc.yml"
      - "scripts/build_batting_performance_season_poc.py"
      - "src/universal_baseball/armstjc_contacts.py"
      - "src/universal_baseball/contact_identity_overlay.py"
      - "src/universal_baseball/contact_profile.py"
      - "src/universal_baseball/performance_season.py"
      - "src/universal_baseball/bin_value_calibration.py"
      - "src/universal_baseball/bin_value_policy.py"
      - "src/universal_baseball/bin_value_pooling.py"
      - "src/universal_baseball/player_game_stats.py"
      - "src/universal_baseball/season_stats.py"
      - "src/universal_baseball/official.py"
      - "src/universal_baseball/storage.py"
      - "tests/test_armstjc_contacts.py"
      - "tests/test_contact_identity_overlay.py"
      - "tests/test_contact_profile.py"
      - "tests/test_performance_season.py"
      - "tests/test_bin_value_calibration.py"

permissions:
  contents: read

jobs:
  build-2024-aaa-batting-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Build 2024 AAA batting Performance player-season POC
        run: python scripts/build_batting_performance_season_poc.py

      - name: Upload Performance POC artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batting-performance-season-poc
          path: reports/generated/batting-performance-season-poc/
          if-no-files-found: warn
          retention-days: 14
