name: Batting Performance season POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-2024-aaa-batting-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Build 2024 AAA batting Performance player-season POC
        run: python scripts/build_batting_performance_season_poc.py

      - name: Upload Performance POC artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batting-performance-season-poc
          path: reports/generated/batting-performance-season-poc/
          if-no-files-found: warn
          retention-days: 14
