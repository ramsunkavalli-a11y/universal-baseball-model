name: Current Talent 2022 outcome residual diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Diagnose six sparse 2022 outcome residuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/diagnose_current_talent_2022_outcome_residuals.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-2022-outcome-residual-diagnostic
          path: reports/generated/current-talent-2022-outcome-residual-diagnostic/
          if-no-files-found: warn
          retention-days: 14
