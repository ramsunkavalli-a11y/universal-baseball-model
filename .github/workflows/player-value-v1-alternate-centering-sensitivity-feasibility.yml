name: Player Value v1 alternate centering sensitivity feasibility

on:
  push:
    branches: [source-certification-poc]
    paths:
      - ".github/workflows/player-value-v1-alternate-centering-sensitivity-feasibility.yml"
      - "scripts/audit_player_value_v1_alternate_centering_sensitivity.py"
      - "src/universal_baseball/player_value_centering_sensitivity_feasibility.py"
      - "tests/test_player_value_centering_sensitivity_feasibility.py"
      - "docs/player-value-v1-mlb-centering-contract.md"
      - "docs/player-value-v1-mlb-centering-source-inventory.json"
      - "docs/playing-time-v1-validation-2023-result.json"
      - "docs/player-value-v1-defensive-position-allocation-result.json"
      - "docs/player-value-v1-dh-positional-exposure-selection-result.json"
      - "docs/player-value-v1-catcher-native-opportunity-selection-result.json"
      - "docs/player-value-v1-steal-projection-selection-result.json"
      - "docs/player-value-v1-advancement-projection-selection-result.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test completeness gate
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]" &&
          python -m pytest -q tests/test_player_value_centering_sensitivity_feasibility.py
      - name: Audit frozen alternate-season surface
        run: >-
          python scripts/audit_player_value_v1_alternate_centering_sensitivity.py
          --output docs/player-value-v1-alternate-centering-sensitivity-feasibility.json
      - name: Persist feasibility result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-alternate-centering-sensitivity-feasibility.json
          git commit -m "Record alternate centering sensitivity feasibility"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: player-value-v1-alternate-centering-sensitivity-feasibility
          path: docs/player-value-v1-alternate-centering-sensitivity-feasibility.json
          if-no-files-found: error
          retention-days: 90

