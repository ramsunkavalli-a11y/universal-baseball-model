name: Current Talent historical source inventory

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run inventory tests
        run: python -m pytest tests/test_current_talent_history.py

      - name: Audit historical source overlap
        run: python scripts/audit_current_talent_historical_inventory.py

      - name: Upload historical inventory
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-historical-inventory
          path: reports/generated/current-talent-historical-inventory/
          if-no-files-found: error
          retention-days: 14
