name: Cross-snapshot resolution audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Resolve real overlapping Rookie snapshots
        run: python scripts/audit_cross_snapshot_resolution.py

      - name: Upload cross-snapshot resolution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-snapshot-resolution-audit
          path: reports/generated/cross-snapshot-resolution/
          if-no-files-found: warn
          retention-days: 14
