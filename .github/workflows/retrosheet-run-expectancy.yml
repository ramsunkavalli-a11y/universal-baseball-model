name: Retrosheet run expectancy validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/retrosheet-run-expectancy.yml"
      - "scripts/audit_retrosheet_run_expectancy.py"
      - "src/universal_baseball/run_expectancy.py"

permissions:
  contents: read

jobs:
  validate-re24:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Validate RE24 on full Retrosheet season
        run: python scripts/audit_retrosheet_run_expectancy.py

      - name: Upload RE24 validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrosheet-re24
          path: reports/generated/retrosheet-re24/
          if-no-files-found: warn
          retention-days: 14
