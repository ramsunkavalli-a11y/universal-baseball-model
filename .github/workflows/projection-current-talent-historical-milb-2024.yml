name: Projection reuse Current Talent historical MiLB 2024

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        level: [aaa, aa, "a+", a, rk]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run historical evidence and source-authority tests
        run: >-
          python -m pytest
          tests/test_armstjc_contacts.py
          tests/test_current_talent_era.py
          tests/test_current_talent_identity_corrections.py
          tests/test_current_talent_milb_source.py
          tests/test_current_talent_milb_evidence.py
          tests/test_current_talent_official_multiteam.py
          tests/test_current_talent_official_outcomes.py
          tests/test_current_talent_official_game_fallback.py
          tests/test_current_talent_official_game_identity.py
          tests/test_current_talent_source_residual_quarantine.py
          tests/test_current_talent_evidence_quarantine.py
          tests/test_current_talent_participant_authority.py
          tests/test_current_talent_season_reconciliation.py
          tests/test_official_mixed_codes.py
          tests/test_season_stat_assets.py

      - name: Materialize 2024 historical Current Talent game evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/materialize_current_talent_historical_milb_game_evidence_projection_gate.py
          --season 2024
          --level "${{ matrix.level }}"

      - name: Require exact 2024 reconciliation and quarantine proof
        env:
          LEVEL: ${{ matrix.level }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          level = os.environ["LEVEL"]
          slug = "aplus" if level == "a+" else level
          path = Path(
              f"reports/generated/current-talent-historical-milb-game-evidence/2024/{slug}/report.json"
          )
          report = json.loads(path.read_text())
          outcome = report["outcome_adjudication"]
          participant = report["participant_authority"]
          cross = participant["exact_source_residual_cross_grain_quarantine"]

          if report.get("accepted") is not True:
              raise SystemExit("historical evidence report is not accepted")
          if outcome.get("post_reconciliation", {}).get("exact_reconciliation") is not True:
              raise SystemExit("season aggregates do not reconcile exactly after adjudication")
          if int(outcome.get("remaining_season_asset_residual_count", -1)) != 0:
              raise SystemExit(
                  f"unresolved season residuals remain: {outcome.get('remaining_season_asset_residual_keys')}"
              )
          if int(report.get("evidence_contract", {}).get("core_profile_count_exceeds_pa_player_game_count", -1)) != 0:
              raise SystemExit("core profile event count exceeds PA for at least one player-game")

          quarantined = sorted(tuple(row) for row in outcome.get("source_only_exact_residual_quarantined_keys", []))
          cross_keys = sorted(tuple(row) for row in cross.get("keys", []))
          if quarantined != cross_keys:
              raise SystemExit("outcome quarantine keys do not match cross-grain quarantine keys")

          applied = [
              row["source_only_exact_residual_quarantine"]
              for row in outcome.get("adjudications", [])
              if row.get("source_only_exact_residual_quarantine", {}).get("applied")
          ]
          if len(applied) != int(outcome.get("source_only_exact_residual_quarantine_count", -1)):
              raise SystemExit("quarantine count does not match applied adjudication proofs")
          for proof in applied:
              if proof.get("season_residual_exact") is not True:
                  raise SystemExit("an applied quarantine lacks exact independent season residual proof")
              if proof.get("official_full_vector_exact_after_removal") is not True:
                  raise SystemExit("an applied quarantine lacks exact official gameLog vector proof")
              if proof.get("source_values_reassigned") is not False:
                  raise SystemExit("an applied quarantine reassigned source values")

          print(json.dumps({
              "level": level,
              "accepted": True,
              "exact_reconciliation": True,
              "remaining_residuals": 0,
              "exact_quarantine_count": len(applied),
              "cross_grain_key_count": len(cross_keys),
              "classification_counts": outcome.get("classification_counts", {}),
          }, indent=2))
          PY

      - name: Upload accepted 2024 historical game evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-historical-milb-full-season-2024-${{ matrix.level }}
          path: reports/generated/current-talent-historical-milb-game-evidence/2024/${{ matrix.level == 'a+' && 'aplus' || matrix.level }}/
          if-no-files-found: warn
          retention-days: 14
