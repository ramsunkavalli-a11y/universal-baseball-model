name: Freeze position-role confirmation parameters

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/position-role-confirmation-parameter-freeze.yml"
      - "docs/position-role-2025-confirmation-contract.md"
      - "scripts/freeze_position_role_confirmation_parameters.py"
      - "src/universal_baseball/position_role_transition.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify parameter-freeze code
        run: >-
          python -m py_compile
          scripts/freeze_position_role_confirmation_parameters.py
          src/universal_baseball/position_role_transition.py
          && python -m pytest -q tests/test_position_role_transition.py

      - name: Download frozen 2021-2024 role-profile evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stability-source
          gh run download 32149415617 \
            --repo ramsunkavalli-a11y/universal-baseball-model \
            --name position-role-batting-profile-stability-2021-2024 \
            --dir stability-source

      - name: Freeze confirmation parameters
        run: >-
          python scripts/freeze_position_role_confirmation_parameters.py
          --source-root stability-source

      - name: Verify pre-2025 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/generated/position-role-confirmation-parameters/parameters.json').read_text())
          assert report['parameters']['primary_share_threshold'] == 0.65
          assert report['parameters']['training_transitions'] == [[2021, 2022], [2022, 2023], [2023, 2024]]
          assert report['boundary']['2025_position_source_accessed'] is False
          assert report['boundary']['2025_position_outcomes_scored'] is False
          assert report['decision']['confirmation_parameters_frozen'] is True
          assert report['decision']['2025_position_source_materialization_authorized'] is True
          PY

      - name: Upload immutable confirmation parameters
        uses: actions/upload-artifact@v7
        with:
          name: position-role-confirmation-parameters
          path: reports/generated/position-role-confirmation-parameters/
          if-no-files-found: error
          retention-days: 30

      - name: Persist parameter-freeze record
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('reports/generated/position-role-confirmation-parameters/parameters.json')
          result = json.loads(source.read_text())
          result['source_run_id'] = int(os.environ['SOURCE_RUN_ID'])
          result['source_sha'] = os.environ['SOURCE_SHA']
          Path('docs/position-role-confirmation-parameters.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/position-role-confirmation-parameters.json
          git commit -m "Persist frozen position-role confirmation parameters"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
