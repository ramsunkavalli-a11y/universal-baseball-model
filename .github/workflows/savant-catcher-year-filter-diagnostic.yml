name: Savant catcher year-filter diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Compile diagnostic
        run: python -m py_compile scripts/diagnose_savant_catcher_year_filters.py
      - name: Query Savant catcher leaderboards
        run: python -u scripts/diagnose_savant_catcher_year_filters.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: savant-catcher-year-filter-diagnostic
          path: reports/generated/savant-catcher-year-filter-diagnostic.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist diagnostic
        run: |
          cp reports/generated/savant-catcher-year-filter-diagnostic.json docs/savant-catcher-year-filter-diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/savant-catcher-year-filter-diagnostic.json
          git commit -m "Persist Savant catcher year-filter diagnostic"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
