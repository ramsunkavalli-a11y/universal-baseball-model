name: Player Value v1 baserunning source audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify source adapters
        run: >-
          python -m py_compile src/universal_baseball/player_value_baserunning_sources.py scripts/audit_player_value_v1_baserunning_sources.py
          && python -m pytest -q tests/test_player_value_baserunning_sources.py tests/test_season_stats.py tests/test_mlb_season_stats.py

      - name: Materialize 2024 MLB baserunning source audit
        run: >-
          python scripts/audit_player_value_v1_baserunning_sources.py
          --season 2024
          --output docs/player-value-v1-baserunning-source-audit-result.json

      - name: Persist baserunning source audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-baserunning-source-audit-result.json
          if git diff --cached --quiet; then
            echo "Baserunning source audit unchanged; validation succeeded."
            exit 0
          fi
          git commit -m "Materialize baserunning source audit"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
