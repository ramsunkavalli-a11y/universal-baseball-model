name: Current Talent 2024 player-game evidence POC

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Public armstjc release inventory is read through GitHub REST. Auth keeps
      # the live POC independent of the low unauthenticated per-IP rate limit.
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: >-
          python -m pytest
          tests/test_current_talent_evidence.py
          tests/test_current_talent_milb_evidence.py
          tests/test_current_talent_mlb_evidence.py
          tests/test_current_talent_universal_evidence.py
          tests/test_current_talent_reconciliation.py

      - name: Download certified 2024 AAA Performance
        uses: actions/download-artifact@v7
        with:
          name: batting-performance-aaa-2024
          path: certified-inputs/aaa
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 31948208695
          github-token: ${{ github.token }}

      - name: Download certified 2024 MLB Performance
        uses: actions/download-artifact@v7
        with:
          name: mlb-batting-performance-2024
          path: certified-inputs/mlb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 31955217794
          github-token: ${{ github.token }}

      - name: Materialize and reconcile AAA + MLB game evidence
        run: >-
          python scripts/materialize_current_talent_game_evidence_2024.py
          --aaa-performance-root certified-inputs/aaa
          --mlb-performance-root certified-inputs/mlb

      - name: Upload Current Talent game-evidence diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-game-evidence-2024-aaa-mlb
          path: reports/generated/current-talent-game-evidence-2024/
          if-no-files-found: warn
          retention-days: 14
