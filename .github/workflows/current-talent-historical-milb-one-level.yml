name: Current Talent historical MiLB one level

on:
  workflow_dispatch:
    inputs:
      season:
        description: Post-reorganization season to materialize
        required: true
        default: "2021"
        type: choice
        options:
          - "2021"
          - "2022"
          - "2023"
      level:
        description: Filename level to materialize
        required: true
        default: "rk"
        type: choice
        options:
          - aaa
          - aa
          - "a+"
          - a
          - rk
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/current-talent-historical-milb-one-level.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '2021' }}
      TARGET_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.level || 'rk' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run historical evidence unit tests
        run: >-
          python -m pytest
          tests/test_current_talent_era.py
          tests/test_current_talent_identity_corrections.py
          tests/test_current_talent_milb_source.py
          tests/test_current_talent_milb_evidence.py
          tests/test_current_talent_official_multiteam.py
          tests/test_current_talent_official_outcomes.py
          tests/test_current_talent_participant_authority.py
          tests/test_current_talent_season_reconciliation.py
          tests/test_official_mixed_codes.py
          tests/test_season_stat_assets.py

      - name: Materialize historical Current Talent game evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/materialize_current_talent_historical_milb_game_evidence.py
          --season "${TARGET_SEASON}"
          --level "${TARGET_LEVEL}"

      - name: Upload historical game-evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-historical-milb-one-level-${{ env.TARGET_SEASON }}-${{ env.TARGET_LEVEL }}
          path: reports/generated/current-talent-historical-milb-game-evidence/${{ env.TARGET_SEASON }}/${{ env.TARGET_LEVEL == 'a+' && 'aplus' || env.TARGET_LEVEL }}/
          if-no-files-found: warn
          retention-days: 14
