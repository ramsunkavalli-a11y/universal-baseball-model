name: State semantics audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-state-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit state semantics
        run: python scripts/audit_state_semantics.py

      - name: Upload state audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: state-semantics-audit
          path: reports/generated/state-semantics-audit/
          if-no-files-found: warn
          retention-days: 14
