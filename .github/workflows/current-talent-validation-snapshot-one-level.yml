name: Current Talent validation snapshot one level

on:
  # One-time self-bootstrap path trigger. Remove after the first real-data run
  # succeeds so live certification remains manual-only.
  push:
    branches:
      - source-certification-poc
    paths:
      - .github/workflows/current-talent-validation-snapshot-one-level.yml
  workflow_dispatch:
    inputs:
      season:
        description: Post-reorganization season to materialize
        required: true
        default: "2021"
        type: choice
        options:
          - "2021"
          - "2022"
          - "2023"
      level:
        description: Filename level to materialize
        required: true
        default: "rk"
        type: choice
        options:
          - aaa
          - aa
          - "a+"
          - a
          - rk
      snapshot_month:
        description: Month-start Current Talent cutoff
        required: true
        default: "8"
        type: choice
        options:
          - "5"
          - "6"
          - "7"
          - "8"
          - "9"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SEASON: ${{ inputs.season || '2021' }}
      TARGET_LEVEL: ${{ inputs.level || 'rk' }}
      SNAPSHOT_MONTH: ${{ inputs.snapshot_month || '8' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run validation dataset unit tests
        run: >-
          python -m pytest
          tests/test_current_talent_evidence.py
          tests/test_current_talent_validation.py
          tests/test_current_talent_validation_dataset.py

      - name: Materialize certified historical game evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/materialize_current_talent_historical_milb_game_evidence.py
          --season "${TARGET_SEASON}"
          --level "${TARGET_LEVEL}"

      - name: Resolve paths and cutoff
        run: |
          if [ "${TARGET_LEVEL}" = "a+" ]; then
            level_dir="aplus"
          else
            level_dir="${TARGET_LEVEL}"
          fi
          printf -v month "%02d" "${SNAPSHOT_MONTH}"
          echo "LEVEL_DIR=${level_dir}" >> "$GITHUB_ENV"
          echo "CUTOFF=${TARGET_SEASON}-${month}-01" >> "$GITHUB_ENV"

      - name: Materialize Current Talent validation snapshot
        run: >-
          python scripts/materialize_current_talent_validation_snapshot.py
          --summary "reports/generated/current-talent-historical-milb-game-evidence/${TARGET_SEASON}/${LEVEL_DIR}/tables/current_talent_game_summary_${TARGET_SEASON}_${TARGET_LEVEL}.parquet"
          --profile "reports/generated/current-talent-historical-milb-game-evidence/${TARGET_SEASON}/${LEVEL_DIR}/tables/current_talent_game_profile_${TARGET_SEASON}_${TARGET_LEVEL}.parquet"
          --cutoff "${CUTOFF}"
          --window-label all_history
          --output-dir "reports/generated/current-talent-validation-snapshot/${TARGET_SEASON}/${LEVEL_DIR}/${CUTOFF}"

      - name: Upload validation snapshot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-validation-snapshot-${{ env.TARGET_SEASON }}-${{ env.TARGET_LEVEL }}-${{ env.SNAPSHOT_MONTH }}
          path: |
            reports/generated/current-talent-validation-snapshot/
            reports/generated/current-talent-historical-milb-game-evidence/${{ env.TARGET_SEASON }}/${{ env.TARGET_LEVEL == 'a+' && 'aplus' || env.TARGET_LEVEL }}/report.json
          if-no-files-found: warn
          retention-days: 14
