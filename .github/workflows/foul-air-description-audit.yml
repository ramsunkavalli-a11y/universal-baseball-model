name: Foul-air description vocabulary audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-foul-air-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 2005-aaa
            asset: 2005_9_aaa_pbp.csv
          - slug: 2015-aaa
            asset: 2015_9_aaa_pbp.csv
          - slug: 2024-rookie
            asset: 2024_6_rk_pbp.csv
          - slug: 2025-aaa
            asset: 2025_3_aaa_pbp.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit ${{ matrix.slug }} foul-air description vocabulary
        run: |
          python scripts/audit_foul_air_descriptions.py \
            --url "https://github.com/armstjc/milb-data-repository/releases/download/pbp/${{ matrix.asset }}" \
            --asset-name "${{ matrix.asset }}" \
            --work-dir "data/quarantine/foul-air-descriptions/${{ matrix.slug }}" \
            --report-dir "reports/generated/foul-air-descriptions/${{ matrix.slug }}"

      - name: Upload ${{ matrix.slug }} foul-air report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foul-air-descriptions-${{ matrix.slug }}
          path: reports/generated/foul-air-descriptions/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14
