name: MLB full-season Performance source gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mlb-full-season-performance-source.yml"
      - "scripts/audit_mlb_full_season_performance_source.py"
      - "src/universal_baseball/savant.py"
      - "src/universal_baseball/mlb_performance.py"
      - "src/universal_baseball/mlb_season_stats.py"
      - "src/universal_baseball/contact_profile.py"
      - "tests/test_savant.py"
      - "tests/test_savant_batting_team.py"
      - "tests/test_mlb_performance.py"
      - "tests/test_mlb_season_stats.py"

permissions:
  contents: read

jobs:
  reconcile-2024-mlb-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Reconcile full-season MLB Performance sources
        run: python scripts/audit_mlb_full_season_performance_source.py

      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-full-season-performance-source
          path: reports/generated/mlb-full-season-performance-source/
          if-no-files-found: warn
          retention-days: 14
