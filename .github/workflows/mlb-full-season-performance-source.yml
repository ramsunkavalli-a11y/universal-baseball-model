name: MLB batting Performance materialization gate

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/build_mlb_batting_performance_2024.py
      - src/universal_baseball/mlb_*.py
      - src/universal_baseball/retrosheet.py
      - src/universal_baseball/performance_*.py
      - .github/workflows/mlb-full-season-performance-source.yml

permissions:
  contents: read

jobs:
  build-2024-mlb-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Materialize completed-2024 MLB batting Performance
        run: python scripts/build_mlb_batting_performance_2024.py

      - name: Upload MLB batting Performance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-batting-performance-2024
          path: reports/generated/mlb-batting-performance-2024/
          if-no-files-found: warn
          retention-days: 14
