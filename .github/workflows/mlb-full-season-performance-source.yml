name: MLB full-season Performance source / bin-value audits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-mlb-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Reconcile full-season 2024 MLB Performance sources
        run: python scripts/audit_mlb_full_season_performance_source.py

      - name: Audit primary 2024 MLB bin-value policy
        run: python scripts/audit_mlb_bin_value_policy.py

      - name: Confirm pre-specified MLB lambda=5 on 2023
        run: python scripts/audit_mlb_bin_value_independent_validation.py

      - name: Upload MLB source and value-policy audits
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-performance-source-and-value-audits
          path: |
            reports/generated/mlb-full-season-performance-source/
            reports/generated/mlb-bin-value-policy/
            reports/generated/mlb-bin-value-independent-validation/
          if-no-files-found: warn
          retention-days: 14
