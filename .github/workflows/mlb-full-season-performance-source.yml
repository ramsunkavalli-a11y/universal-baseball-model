name: MLB bin value independent confirmation

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/audit_mlb_bin_value_independent_validation.py
      - .github/workflows/mlb-full-season-performance-source.yml

permissions:
  contents: read

jobs:
  confirm-2023-mlb-bin-values:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Confirm pre-specified MLB lambda=5 on 2023
        run: python scripts/audit_mlb_bin_value_independent_validation.py

      - name: Upload MLB independent confirmation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-bin-value-independent-validation
          path: reports/generated/mlb-bin-value-independent-validation/
          if-no-files-found: warn
          retention-days: 14
