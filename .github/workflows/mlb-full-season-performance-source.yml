name: MLB bin value policy gate

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/audit_mlb_bin_value_policy.py
      - .github/workflows/mlb-full-season-performance-source.yml

permissions:
  contents: read

jobs:
  audit-2024-mlb-bin-values:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit 2024 MLB Performance-bin value policy
        run: python scripts/audit_mlb_bin_value_policy.py

      - name: Upload MLB bin-value policy artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlb-bin-value-policy
          path: reports/generated/mlb-bin-value-policy/
          if-no-files-found: warn
          retention-days: 14
