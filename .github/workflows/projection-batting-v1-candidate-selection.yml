name: Projection batting v1 2022 candidate selection

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify frozen selection implementation before artifact downloads
        run: >-
          python -m py_compile
          src/universal_baseball/projection_ridge.py
          src/universal_baseball/projection_training.py
          src/universal_baseball/projection_selection.py
          scripts/materialize_projection_batting_v1_candidate_selection.py
          && python -m pytest -q
          tests/test_projection_ridge.py
          tests/test_projection_training.py
          tests/test_projection_selection.py

      - name: Download immutable training responses
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-training-responses
          path: inputs/training-responses
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32100142102
          github-token: ${{ github.token }}

      - name: Download immutable development targets
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-development-evidence
          path: inputs/development-evidence
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32097702869
          github-token: ${{ github.token }}

      - name: Download immutable frozen B2 snapshots
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-current-talent-snapshots
          path: inputs/current-talent-snapshots
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32099733186
          github-token: ${{ github.token }}

      - name: Run frozen 2022-only candidate grid
        run: >-
          python scripts/materialize_projection_batting_v1_candidate_selection.py
          --training-responses-root inputs/training-responses
          --development-evidence-root inputs/development-evidence
          --snapshot-root inputs/current-talent-snapshots

      - name: Upload Projection candidate-selection result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: projection-batting-v1-candidate-selection
          path: reports/generated/projection-batting-v1-candidate-selection/
          if-no-files-found: warn
          retention-days: 14
