name: Season stat official reconciliation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/season-stat-official-reconciliation.yml"
      - "scripts/audit_season_stat_official_reconciliation.py"
      - "src/universal_baseball/official_capture.py"

permissions:
  contents: read

jobs:
  reconcile-season-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Reconcile season aggregates
        run: python scripts/audit_season_stat_official_reconciliation.py

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: season-stat-official-reconciliation
          path: reports/generated/season-stat-official-reconciliation/
          if-no-files-found: warn
          retention-days: 14
