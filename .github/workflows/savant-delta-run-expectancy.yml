name: Savant delta run expectancy audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-2024-savant-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit Savant delta_run_exp
        run: python scripts/audit_savant_delta_run_expectancy.py

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: savant-delta-run-expectancy
          path: reports/generated/savant-delta-run-expectancy/
          if-no-files-found: warn
          retention-days: 14
