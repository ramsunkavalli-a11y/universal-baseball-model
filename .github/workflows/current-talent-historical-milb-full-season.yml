name: Current Talent historical MiLB full season

on:
  workflow_dispatch:
    inputs:
      season:
        description: Post-reorganization season to materialize
        required: true
        default: "2021"
        type: choice
        options:
          - "2021"
          - "2022"
          - "2023"
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/current-talent-historical-milb-full-season.yml"
      - "scripts/materialize_current_talent_historical_milb_game_evidence.py"
      - "src/universal_baseball/current_talent_era.py"
      - "src/universal_baseball/current_talent_milb_source.py"
      - "src/universal_baseball/current_talent_milb_evidence.py"
      - "src/universal_baseball/current_talent_official_outcomes.py"
      - "src/universal_baseball/current_talent_season_reconciliation.py"
      - "src/universal_baseball/current_talent_participant_authority.py"
      - "src/universal_baseball/season_stat_assets.py"
      - "src/universal_baseball/contact_identity_overlay.py"
      - "src/universal_baseball/armstjc_contacts.py"
      - "src/universal_baseball/official.py"
      - "tests/test_current_talent_era.py"
      - "tests/test_current_talent_milb_source.py"
      - "tests/test_current_talent_milb_evidence.py"
      - "tests/test_current_talent_official_outcomes.py"
      - "tests/test_current_talent_participant_authority.py"
      - "tests/test_current_talent_season_reconciliation.py"
      - "tests/test_official_mixed_codes.py"
      - "tests/test_season_stat_assets.py"

permissions:
  contents: read

jobs:
  materialize:
    env:
      TARGET_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '2021' }}
    strategy:
      fail-fast: false
      matrix:
        level: [aaa, aa, "a+", a, rk]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run historical evidence unit tests
        run: >-
          python -m pytest
          tests/test_current_talent_era.py
          tests/test_current_talent_milb_source.py
          tests/test_current_talent_milb_evidence.py
          tests/test_current_talent_official_outcomes.py
          tests/test_current_talent_participant_authority.py
          tests/test_current_talent_season_reconciliation.py
          tests/test_official_mixed_codes.py
          tests/test_season_stat_assets.py

      - name: Materialize historical Current Talent game evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/materialize_current_talent_historical_milb_game_evidence.py
          --season "${TARGET_SEASON}"
          --level "${{ matrix.level }}"

      - name: Upload historical game-evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-historical-milb-full-season-${{ env.TARGET_SEASON }}-${{ matrix.level }}
          path: reports/generated/current-talent-historical-milb-game-evidence/${{ env.TARGET_SEASON }}/${{ matrix.level == 'a+' && 'aplus' || matrix.level }}/
          if-no-files-found: warn
          retention-days: 14
