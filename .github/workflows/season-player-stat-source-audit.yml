name: Season player stat source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-season-player-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit season player stat schemas
        run: python scripts/audit_season_player_stat_sources.py

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: season-player-stat-source-audit
          path: reports/generated/season-player-stat-source-audit/
          if-no-files-found: warn
          retention-days: 14
