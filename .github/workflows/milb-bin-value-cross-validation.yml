name: MiLB bin value cross-validation

on:
  pull_request:
    paths:
      - ".github/workflows/milb-bin-value-cross-validation.yml"
      - "scripts/audit_milb_bin_value_cross_validation.py"

permissions:
  contents: read

jobs:
  cross-validate-bin-values:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Run five-fold predictive pooling validation
        run: python scripts/audit_milb_bin_value_cross_validation.py --games-per-environment 45

      - name: Upload cross-validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: milb-bin-value-cross-validation
          path: reports/generated/milb-bin-value-cross-validation/
          if-no-files-found: warn
          retention-days: 14
