# track 2024 MLB certification before Projection development surfaces
name: Projection recovery status probe

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/projection-recovery-status-probe.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture latest recovery workflow states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          workflows = {
              "source_only_outcome_audit": "projection-2024-source-only-outcome-row-audit.yml",
              "recovery_audit": "projection-2024-exact-game-source-gap-audit-recovery.yml",
              "exact_game_audit_original": "projection-2024-exact-game-source-gap-audit.yml",
              "historical_milb_2024": "projection-current-talent-historical-milb-2024.yml",
              "historical_mlb": "current-talent-historical-mlb-season.yml",
              "projection_contracts": "projection-validation-contracts-ci.yml",
              "development_evidence": "projection-batting-v1-development-evidence.yml",
          }
          output = {"gate": "projection_recovery_status_probe", "workflows": {}}
          env = dict(os.environ)
          for key, workflow in workflows.items():
              result = subprocess.run([
                  "gh", "run", "list",
                  "--repo", "ramsunkavalli-a11y/universal-baseball-model",
                  "--workflow", workflow,
                  "--branch", "source-certification-poc",
                  "--limit", "5",
                  "--json", "databaseId,status,conclusion,headSha,createdAt,updatedAt,displayTitle,url",
              ], check=True, text=True, capture_output=True, env=env)
              output["workflows"][key] = json.loads(result.stdout)
          Path("docs/projection-recovery-status.json").write_text(json.dumps(output, indent=2, sort_keys=True) + "\n")
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - name: Persist recovery status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/projection-recovery-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Projection recovery workflow status"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
