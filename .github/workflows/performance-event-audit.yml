name: Performance event mapping audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/performance-event-audit.yml"
      - "scripts/audit_performance_event_mapping.py"
      - "src/universal_baseball/performance_events.py"

permissions:
  contents: read

jobs:
  audit-performance-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit Performance event mapping
        run: python scripts/audit_performance_event_mapping.py

      - name: Upload Performance event audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-event-audit
          path: reports/generated/performance-event-audit/
          if-no-files-found: warn
          retention-days: 14
