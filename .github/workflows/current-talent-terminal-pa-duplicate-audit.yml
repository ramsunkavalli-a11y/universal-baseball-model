name: Current Talent terminal-PA duplicate audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile duplicate audit
        run: python -m py_compile scripts/audit_current_talent_terminal_pa_duplicates.py

      - name: Audit terminal PA duplicate consistency
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_current_talent_terminal_pa_duplicates.py

      - name: Upload duplicate audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-terminal-pa-duplicates
          path: reports/generated/current-talent-terminal-pa-duplicates/
          if-no-files-found: warn
          retention-days: 14
