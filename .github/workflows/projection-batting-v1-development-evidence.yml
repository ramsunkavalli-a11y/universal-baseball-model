name: Projection batting v1 development evidence

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/projection-batting-v1-development-evidence.yml"
      - "src/universal_baseball/current_talent_universal_evidence.py"
      - "scripts/materialize_projection_batting_v1_development_evidence.py"
      - "tests/test_current_talent_universal_evidence.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify universal evidence schema contract
        run: python -m pytest -q tests/test_current_talent_universal_evidence.py

      - name: Seed immutable certified 2021-2024 evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="ramsunkavalli-a11y/universal-baseball-model"
          mkdir -p seeded

          download() {
            local run_id="$1"
            local artifact="$2"
            local dest="$3"
            mkdir -p "$dest"
            gh run download "$run_id" --repo "$repo" --name "$artifact" --dir "$dest"
          }

          # Certified affiliated MiLB full-season evidence.
          for level in aaa aa 'a+' a rk; do
            download 31979609553 "current-talent-historical-milb-full-season-2021-${level}" "seeded/2021/milb/${level}"
            download 31971662070 "current-talent-historical-milb-full-season-${level}" "seeded/2022/milb/${level}"
            download 31971923778 "current-talent-historical-milb-full-season-2023-${level}" "seeded/2023/milb/${level}"
            download 32095039114 "current-talent-historical-milb-full-season-2024-${level}" "seeded/2024/milb/${level}"
          done

          # Certified MLB full-season evidence. The accepted 2024 artifact is a
          # mixed AAA+MLB bundle but contains standalone *_2024_mlb parquet files.
          download 31986504169 "current-talent-historical-mlb-2021" "seeded/2021/mlb"
          download 31988255280 "current-talent-historical-mlb-2022" "seeded/2022/mlb"
          download 31989561396 "current-talent-historical-mlb-2023" "seeded/2023/mlb"
          download 31958748147 "current-talent-game-evidence-2024-aaa-mlb" "seeded/2024/mlb"

      - name: Verify expected pinned evidence files
        run: |
          set -euo pipefail
          for year in 2021 2022 2023 2024; do
            for slug in aaa aa aplus a rk; do
              test "$(find "seeded/${year}/milb" -type f -name "current_talent_game_summary_${year}_${slug}.parquet" | wc -l)" -eq 1
              test "$(find "seeded/${year}/milb" -type f -name "current_talent_game_profile_${year}_${slug}.parquet" | wc -l)" -eq 1
            done
            test "$(find "seeded/${year}/mlb" -type f -name "current_talent_game_summary_${year}_mlb.parquet" | wc -l)" -eq 1
            test "$(find "seeded/${year}/mlb" -type f -name "current_talent_game_profile_${year}_mlb.parquet" | wc -l)" -eq 1
          done

      - name: Run Projection evidence-only materialization
        run: >-
          python scripts/materialize_projection_batting_v1_development_evidence.py
          --input-root seeded

      - name: Upload Projection development evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: projection-batting-v1-development-evidence
          path: reports/generated/projection-batting-v1-development-evidence/
          if-no-files-found: warn
          retention-days: 14
