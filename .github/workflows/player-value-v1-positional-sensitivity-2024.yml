name: Player Value v1 positional sensitivity 2024

on:
  push:
    branches: [source-certification-poc]
    paths:
      - ".github/workflows/player-value-v1-positional-sensitivity-2024.yml"
      - "scripts/materialize_player_value_v1_positional_sensitivity.py"
      - "src/universal_baseball/player_value_positional_adjustment.py"
      - "tests/test_player_value_positional_adjustment.py"
      - "docs/player-value-v1-positional-adjustment-contract.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test sensitivity implementation
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]" &&
          python -m pytest -q tests/test_player_value_positional_adjustment.py
      - name: Download frozen defensive position allocation
        uses: actions/download-artifact@v7
        with:
          artifact-ids: "9370211679"
          path: inputs/position-allocation
          github-token: ${{ github.token }}
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "32266007594"
      - name: Download frozen DH exposure
        uses: actions/download-artifact@v7
        with:
          artifact-ids: "9371840453"
          path: inputs/dh-exposure
          github-token: ${{ github.token }}
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "32270141291"
      - name: Materialize Baseball-Reference schedule sensitivity
        run: >-
          python scripts/materialize_player_value_v1_positional_sensitivity.py
          --position-allocation inputs/position-allocation/allocation_scored.parquet
          --dh-exposure inputs/dh-exposure/scored_dh_exposure.parquet
          --output-json docs/player-value-v1-positional-adjustment-sensitivity-2024.json
          --output-table reports/generated/player-value-v1-positional-adjustment-sensitivity-2024.parquet
      - name: Persist sensitivity result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-positional-adjustment-sensitivity-2024.json
          git commit -m "Freeze 2024 positional schedule sensitivity"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
      - name: Upload player sensitivity table
        uses: actions/upload-artifact@v7
        with:
          name: player-value-v1-positional-adjustment-sensitivity-2024
          path: |
            docs/player-value-v1-positional-adjustment-sensitivity-2024.json
            reports/generated/player-value-v1-positional-adjustment-sensitivity-2024.parquet
          if-no-files-found: error
          retention-days: 90
