name: Contact sequence authority audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        level: ["aa", "rk"]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit play-sequence participant authority
        run: python scripts/audit_contact_sequence_authority.py --level '${{ matrix.level }}'

      - name: Upload authority artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contact-sequence-authority-${{ matrix.level }}
          path: reports/generated/contact-sequence-authority/
          if-no-files-found: warn
          retention-days: 14
