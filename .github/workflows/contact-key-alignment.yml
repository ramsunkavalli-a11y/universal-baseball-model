name: Contact sequence authority audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/contact-key-alignment.yml"
      - "scripts/audit_contact_sequence_authority.py"
      - "scripts/build_batting_performance_level_poc.py"
      - "src/universal_baseball/player_game_controls.py"
      - "src/universal_baseball/contact_identity_overlay.py"
      - "src/universal_baseball/armstjc_contacts.py"
      - "src/universal_baseball/performance_level_config.py"

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        level: ["aa", "rk"]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit play-sequence participant authority
        run: python scripts/audit_contact_sequence_authority.py --level '${{ matrix.level }}'

      - name: Upload authority artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contact-sequence-authority-${{ matrix.level }}
          path: reports/generated/contact-sequence-authority/
          if-no-files-found: warn
          retention-days: 14
