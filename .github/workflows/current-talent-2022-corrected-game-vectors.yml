name: Current Talent 2022 corrected game vectors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python scripts/diagnose_current_talent_2022_corrected_game_vectors.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-2022-corrected-game-vectors
          path: reports/generated/current-talent-2022-corrected-game-vectors/
          if-no-files-found: warn
          retention-days: 14
