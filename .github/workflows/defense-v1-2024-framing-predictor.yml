name: Defense v1 2024 framing predictor source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    name: materialize frozen 2024 MLB tracked-framing predictor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pinned source dependency
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install "sportsdataverse==0.0.75"

      - name: Verify frozen framing parameter authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          params = json.loads(Path("docs/defense-v1-framing-repair-parameters.json").read_text())
          if params.get("status") != "repaired_framing_parameters_frozen_ready_for_2024_predictor_source":
              raise SystemExit("repaired framing parameters are not frozen")
          if params.get("parameter_hash") != "sha256:e75ebd58d868b6cb6d51f2d0e48d49c1735a4cfa80661b6280269311a7875086":
              raise SystemExit("repaired framing parameter hash changed")
          decision = params.get("decision", {})
          if decision.get("2024_framing_confirmation_predictor_materialization_authorized_next") is not True:
              raise SystemExit("2024 framing predictor source is not authorized")
          if decision.get("2025_framing_target_materialization_authorized") is not False:
              raise SystemExit("2025 framing target opened before predictor source")
          if decision.get("war_value_authorized") is not False:
              raise SystemExit("WAR/value boundary changed")
          boundary = params.get("boundary", {})
          if boundary.get("2025_framing_target_accessed") is not False:
              raise SystemExit("2025 framing target boundary already crossed")
          print(f"frozen framing parameter hash: {params['parameter_hash']}")
          PY

      - name: Verify source script compiles
        run: python -m py_compile scripts/materialize_defense_v1_2024_framing_predictor.py

      - name: Materialize 2024 MLB framing predictor source
        run: >-
          python -u scripts/materialize_defense_v1_2024_framing_predictor.py
          --output-root reports/generated/defense-v1-2024-framing-predictor

      - name: Pin source workflow metadata
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("reports/generated/defense-v1-2024-framing-predictor/report.json")
          result = json.loads(path.read_text())
          result["source_run_id"] = int(os.environ["SOURCE_RUN_ID"])
          result["source_sha"] = os.environ["SOURCE_SHA"]
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload certified 2024 MLB framing predictor source
        uses: actions/upload-artifact@v7
        with:
          name: defense-v1-2024-framing-predictor
          path: reports/generated/defense-v1-2024-framing-predictor/
          if-no-files-found: error
          retention-days: 30

      - name: Persist 2024 framing predictor source result
        run: |
          set -euo pipefail
          cp reports/generated/defense-v1-2024-framing-predictor/report.json docs/defense-v1-2024-framing-predictor-source-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-2024-framing-predictor-source-result.json
          git commit -m "Persist Defense v1 2024 framing predictor source"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1