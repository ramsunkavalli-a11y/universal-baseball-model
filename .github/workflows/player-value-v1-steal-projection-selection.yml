name: Player Value v1 steal projection selection

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/player-value-v1-steal-projection-selection.yml"
      - "src/universal_baseball/player_value_steal_projection.py"
      - "src/universal_baseball/player_value_steal_data.py"
      - "src/universal_baseball/player_value_steal_sources.py"
      - "src/universal_baseball/player_value_baserunning_sources.py"
      - "src/universal_baseball/season_stats.py"
      - "src/universal_baseball/season_stat_assets.py"
      - "src/universal_baseball/mlb_season_stats.py"
      - "src/universal_baseball/player_value_mlb_run_environment.py"
      - "tests/test_player_value_steal_projection.py"
      - "tests/test_player_value_steal_data.py"
      - "tests/test_player_value_steal_sources.py"
      - "tests/test_player_value_baserunning_sources.py"
      - "scripts/select_player_value_v1_steal_projection.py"
      - "docs/player-value-v1-baserunning-source-audit-contract.md"
      - "docs/player-value-v1-steal-projection-selection-contract.md"
      - "docs/player-value-v1-steal-projection-diagnostic-thresholds.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify steal diagnostic implementation
        run: >-
          python -m py_compile
          src/universal_baseball/player_value_steal_projection.py
          src/universal_baseball/player_value_steal_data.py
          src/universal_baseball/player_value_steal_sources.py
          scripts/select_player_value_v1_steal_projection.py
          && python -m pytest -q
          tests/test_player_value_steal_projection.py
          tests/test_player_value_steal_data.py
          tests/test_player_value_steal_sources.py
          tests/test_player_value_baserunning_sources.py
          tests/test_season_stats.py
          tests/test_mlb_season_stats.py

      - name: Run predeclared steal selection and held-out confirmation
        run: >-
          python scripts/select_player_value_v1_steal_projection.py
          --output docs/player-value-v1-steal-projection-selection-result.json

      - name: Persist steal selection result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-steal-projection-selection-result.json
          if git diff --cached --quiet; then
            echo "Steal projection selection result unchanged; validation succeeded."
            exit 0
          fi
          git commit -m "Materialize steal projection selection"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
