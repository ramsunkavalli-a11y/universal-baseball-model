name: Defense v1 framing 2025 confirmation

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  confirm:
    name: run frozen one-shot framing confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and frozen dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install "sportsdataverse==0.0.75"

      - name: Resolve certified source prerequisites
        id: sources
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          params = json.loads(Path("docs/defense-v1-framing-repair-parameters.json").read_text())
          predictor = json.loads(Path("docs/defense-v1-2024-framing-predictor-source-result.json").read_text())
          target = json.loads(Path("docs/defense-v1-2025-framing-target-source-result.json").read_text())
          if params.get("parameter_hash") != "sha256:e75ebd58d868b6cb6d51f2d0e48d49c1735a4cfa80661b6280269311a7875086":
              raise SystemExit("framing parameter hash changed")
          if predictor.get("status") != "source_materialized":
              raise SystemExit("2024 framing predictor not certified")
          if predictor.get("boundary", {}).get("model_fit") is not False:
              raise SystemExit("2024 predictor source was not source-only")
          if target.get("status") != "source_materialized":
              raise SystemExit("2025 framing target source not certified")
          if target.get("decision", {}).get("framing_confirmation_scoring_authorized_next") is not True:
              raise SystemExit("2025 framing target source did not authorize confirmation")
          tb = target.get("boundary", {})
          if tb.get("model_fit") is not False or tb.get("model_scoring") is not False or tb.get("confirmation_interpreted") is not False:
              raise SystemExit("2025 framing target source crossed source-only boundary")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as h:
              h.write(f"predictor_run={int(predictor['source_run_id'])}\n")
              h.write(f"target_run={int(target['source_run_id'])}\n")
          print("framing confirmation prerequisites verified")
          PY

      - name: Download certified historical fielding source
        uses: actions/download-artifact@v7
        with:
          name: position-role-historical-source-2021-2024
          path: inputs/historical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32148467330

      - name: Download certified 2024 framing predictor
        uses: actions/download-artifact@v7
        with:
          name: defense-v1-2024-framing-predictor
          path: inputs/predictor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.sources.outputs.predictor_run }}

      - name: Download certified 2025 framing target
        uses: actions/download-artifact@v7
        with:
          name: defense-v1-2025-framing-target-source
          path: inputs/target
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.sources.outputs.target_run }}

      - name: Verify scorer compiles
        run: python -m py_compile scripts/confirm_defense_v1_framing_2025.py

      - name: Run frozen one-shot framing confirmation
        run: >-
          python -u scripts/confirm_defense_v1_framing_2025.py
          --historical-root inputs/historical
          --predictor-root inputs/predictor
          --target-root inputs/target
          --output-root reports/generated/defense-v1-framing-2025-confirmation

      - name: Pin confirmation metadata
        env:
          CONFIRMATION_RUN_ID: ${{ github.run_id }}
          CONFIRMATION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("reports/generated/defense-v1-framing-2025-confirmation/report.json")
          result = json.loads(path.read_text())
          result["confirmation_run_id"] = int(os.environ["CONFIRMATION_RUN_ID"])
          result["confirmation_sha"] = os.environ["CONFIRMATION_SHA"]
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload framing confirmation result
        uses: actions/upload-artifact@v7
        with:
          name: defense-v1-framing-2025-confirmation
          path: reports/generated/defense-v1-framing-2025-confirmation/
          if-no-files-found: error
          retention-days: 30

      - name: Persist binding framing confirmation result
        run: |
          set -euo pipefail
          cp reports/generated/defense-v1-framing-2025-confirmation/report.json docs/defense-v1-framing-2025-confirmation-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-framing-2025-confirmation-result.json
          git commit -m "Persist Defense v1 framing 2025 confirmation"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
