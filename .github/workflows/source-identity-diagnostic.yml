name: Reusable-source identity diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/source-identity-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 2025-aaa
            asset: 2025_3_aaa_pbp.csv
            key_args: "--key 781756:47"
          - slug: 2023-rookie
            asset: 2023_8_rk_pbp.csv
            key_args: "--key 741849:14 --key 743157:59 --key 743157:26"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Diagnose ${{ matrix.slug }} identity examples
        run: |
          python scripts/diagnose_armstjc_identity_examples.py \
            --url "https://github.com/armstjc/milb-data-repository/releases/download/pbp/${{ matrix.asset }}" \
            --asset-name "${{ matrix.asset }}" \
            ${{ matrix.key_args }} \
            --work-dir "data/quarantine/source-identity-diagnostic/${{ matrix.slug }}" \
            --report-dir "reports/generated/source-identity-diagnostic/${{ matrix.slug }}"

      - name: Upload ${{ matrix.slug }} diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-identity-diagnostic-${{ matrix.slug }}
          path: reports/generated/source-identity-diagnostic/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14
