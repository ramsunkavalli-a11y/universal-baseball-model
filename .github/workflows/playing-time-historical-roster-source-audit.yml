# retrigger live historical roster source audit; no source-contract change
name: Playing-time historical roster source audit

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/playing-time-historical-roster-source-audit.yml"
      - "src/universal_baseball/playing_time_roster_source.py"
      - "scripts/audit_playing_time_historical_roster_source.py"
      - "tests/test_playing_time_roster_source.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify source adapter before live calls
        run: >-
          python -m py_compile
          src/universal_baseball/playing_time_roster_source.py
          scripts/audit_playing_time_historical_roster_source.py
          && python -m pytest -q tests/test_playing_time_roster_source.py

      - name: Audit official historical roster snapshots
        id: live_audit
        continue-on-error: true
        run: python scripts/audit_playing_time_historical_roster_source.py

      - name: Upload source audit and immutable captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playing-time-historical-roster-source-audit
          path: |
            reports/generated/playing-time-historical-roster-source/
            data/quarantine/playing-time-historical-roster-source/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist binding source-audit result
        if: always()
        run: |
          set -euo pipefail
          test -f reports/generated/playing-time-historical-roster-source/report.json
          cp reports/generated/playing-time-historical-roster-source/report.json docs/playing-time-historical-roster-source-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/playing-time-historical-roster-source-result.json
          git commit -m "Persist playing-time historical roster source result"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce live-audit acceptance
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.live_audit.outcome }}
        run: test "$AUDIT_OUTCOME" = "success"
