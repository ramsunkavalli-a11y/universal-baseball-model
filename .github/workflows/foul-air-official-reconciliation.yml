name: Foul-air official narrative reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/foul-air-official-reconciliation.yml"
      - "scripts/audit_foul_air_official_reconciliation.py"
      - "scripts/audit_foul_air_descriptions.py"

permissions:
  contents: read

jobs:
  reconcile-foul-air:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 2005-aaa
            asset: 2005_9_aaa_pbp.csv
          - slug: 2015-aaa
            asset: 2015_9_aaa_pbp.csv
          - slug: 2024-rookie
            asset: 2024_6_rk_pbp.csv
          - slug: 2025-aaa
            asset: 2025_3_aaa_pbp.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Reconcile ${{ matrix.slug }} narratives
        run: |
          python scripts/audit_foul_air_official_reconciliation.py \
            --url "https://github.com/armstjc/milb-data-repository/releases/download/pbp/${{ matrix.asset }}" \
            --asset-name "${{ matrix.asset }}" \
            --sample-per-class 6 \
            --work-dir "data/quarantine/foul-air-official/${{ matrix.slug }}" \
            --report-dir "reports/generated/foul-air-official/${{ matrix.slug }}"

      - name: Upload ${{ matrix.slug }} reconciliation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foul-air-official-${{ matrix.slug }}
          path: reports/generated/foul-air-official/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14
