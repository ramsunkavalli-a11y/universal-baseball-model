name: Defense v1 pre-2025 parameter freeze

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    name: refit and freeze retained Defense v1 parameters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and frozen Defense dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install "sportsdataverse==0.0.75" "scipy>=1.13,<2"

      - name: Download certified historical fielding source
        uses: actions/download-artifact@v7
        with:
          name: position-role-historical-source-2021-2024
          path: inputs/historical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32148467330

      - name: Download frozen tracked source aggregate
        uses: actions/download-artifact@v7
        with:
          name: defense-v1-tracked-source-2021-2023
          path: inputs/tracked
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32182019495

      - name: Verify pre-2025 freeze boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          contract = Path("docs/defense-v1-2025-confirmation-contract.md")
          if not contract.exists():
              raise SystemExit("missing frozen 2025 confirmation contract")
          text = contract.read_text(encoding="utf-8")
          if "FROZEN BEFORE" not in text:
              raise SystemExit("confirmation contract is not marked frozen")

          tracked = json.loads(Path("docs/defense-v1-tracked-challenger-result.json").read_text())
          decision = tracked.get("decision", {})
          if decision.get("pre_2025_defense_development_closed") is not True:
              raise SystemExit("pre-2025 Defense development is not closed")
          if decision.get("final_refit_and_parameter_freeze_authorized_next") is not True:
              raise SystemExit("parameter freeze not authorized")
          if decision.get("2025_confirmation_authorized") is not False:
              raise SystemExit("2025 confirmation boundary changed before freeze")
          if decision.get("war_value_authorized") is not False:
              raise SystemExit("WAR/value boundary changed")
          if tracked.get("boundary", {}).get("2025_defensive_targets_accessed") is not False:
              raise SystemExit("2025 defensive target boundary crossed")

          source = json.loads(Path("docs/defense-v1-tracked-source-result.json").read_text())
          if source.get("source_run_id") != 32182019495:
              raise SystemExit("tracked source run changed")
          if source.get("source_sha") != "5438e905d24e2167432a52253320ccbc978186b8":
              raise SystemExit("tracked source SHA changed")
          if source.get("boundary", {}).get("2025_source_accessed") is not False:
              raise SystemExit("tracked source crossed 2025 boundary")

          root = Path("inputs/tracked")
          matches = list(root.rglob("tracked_range_proxy_2021_2023.parquet"))
          if len(matches) != 1:
              raise SystemExit(f"expected one frozen tracked range parquet; observed={matches}")
          actual = hashlib.sha256(matches[0].read_bytes()).hexdigest()
          expected = source["storage"]["range"]["sha256"]
          if actual != expected:
              raise SystemExit(f"tracked range SHA mismatch: {actual} != {expected}")
          print("pre-2025 boundary and tracked hash verified")
          PY

      - name: Verify freeze script compiles
        run: python -m py_compile scripts/freeze_defense_v1_parameters.py

      - name: Refit and freeze retained Defense v1 components
        id: refit
        continue-on-error: true
        run: |
          set -o pipefail
          python -u scripts/freeze_defense_v1_parameters.py \
            --historical-root inputs/historical \
            --tracked-root inputs/tracked \
            --universal-result docs/defense-v1-universal-development-result.json \
            --tracked-result docs/defense-v1-tracked-challenger-result.json \
            --tracked-source-result docs/defense-v1-tracked-source-result.json \
            --confirmation-contract docs/defense-v1-2025-confirmation-contract.md \
            2>&1 | tee defense-v1-parameter-freeze.log

      - name: Persist refit failure diagnostic
        if: steps.refit.outcome == 'failure'
        env:
          FREEZE_RUN_ID: ${{ github.run_id }}
          FREEZE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path("defense-v1-parameter-freeze.log")
          lines = log.read_text(encoding="utf-8", errors="replace").splitlines() if log.exists() else []
          payload = {
              "diagnostic_only": True,
              "freeze_run_id": int(os.environ["FREEZE_RUN_ID"]),
              "freeze_sha": os.environ["FREEZE_SHA"],
              "refit_outcome": "failure",
              "log_tail": lines[-120:],
              "boundary": {
                  "2025_defensive_targets_accessed": False,
                  "war_value_authorized": False,
              },
          }
          Path("docs/defense-v1-parameter-freeze-failure.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-parameter-freeze-failure.json
          git commit -m "Persist Defense v1 parameter-freeze failure diagnostic"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then break; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Pin freeze workflow metadata
        if: steps.refit.outcome == 'success'
        env:
          FREEZE_RUN_ID: ${{ github.run_id }}
          FREEZE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("reports/generated/defense-v1-parameter-freeze/report.json")
          result = json.loads(path.read_text())
          result["freeze_run_id"] = int(os.environ["FREEZE_RUN_ID"])
          result["freeze_sha"] = os.environ["FREEZE_SHA"]
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload frozen Defense v1 parameter package
        if: steps.refit.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: defense-v1-pre-2025-parameter-freeze
          path: reports/generated/defense-v1-parameter-freeze/
          if-no-files-found: error
          retention-days: 30

      - name: Persist binding pre-2025 Defense v1 parameter result
        if: steps.refit.outcome == 'success'
        run: |
          set -euo pipefail
          cp reports/generated/defense-v1-parameter-freeze/report.json docs/defense-v1-confirmation-parameters.json
          rm -f docs/defense-v1-parameter-freeze-failure.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-confirmation-parameters.json
          git add -u docs/defense-v1-parameter-freeze-failure.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Defense v1 pre-2025 parameter freeze"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
