name: Current Talent contact-value 2023 confirmation chronology

# Triggered after accepted 2023 source + tracking checkpoints are persisted.
on:
  push:
    branches:
      - source-certification-poc
    paths:
      - "scripts/audit_current_talent_contact_value_confirmation_chronology.py"
      - ".github/workflows/current-talent-contact-value-confirmation-chronology.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Require accepted frozen prerequisites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          refit = json.loads(Path("docs/current-talent-contact-value-confirmation-refit-result.json").read_text())
          source = json.loads(Path("docs/current-talent-contact-value-confirmation-source-result.json").read_text())
          tracking = json.loads(Path("docs/current-talent-batted-ball-tracking-confirmation-result.json").read_text())
          if refit.get("gate") != "current_talent_contact_value_confirmation_refit_2021_2022":
              raise SystemExit("wrong frozen confirmation refit gate")
          if source.get("gate") != "current_talent_contact_value_confirmation_source_2023":
              raise SystemExit("2023 confirmation source checkpoint not accepted")
          if tracking.get("gate") != "current_talent_batted_ball_tracking_confirmation":
              raise SystemExit("confirmation tracking checkpoint not accepted")
          if source.get("boundary", {}).get("confirmation_scoring_performed") is not False:
              raise SystemExit("2023 source already scored")
          if tracking.get("boundary", {}).get("model_scoring") is not False:
              raise SystemExit("tracking checkpoint already scored")
          PY

      - name: Compile confirmation chronology audit
        run: python -m py_compile scripts/audit_current_talent_contact_value_confirmation_chronology.py

      - name: Download accepted 2021-22 valued chronology
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-chronology
          path: seeded/development-chronology
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32074805618
          github-token: ${{ github.token }}

      - name: Download accepted 2023 confirmation source
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-confirmation-source-v2
          path: seeded/confirmation-source
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32082637028
          github-token: ${{ github.token }}

      - name: Audit fixed 2023 confirmation chronology without scoring
        run: >-
          python scripts/audit_current_talent_contact_value_confirmation_chronology.py
          --development-chronology-root seeded/development-chronology
          --confirmation-source-root seeded/confirmation-source

      - name: Upload confirmation chronology artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-confirmation-chronology
          path: reports/generated/current-talent-contact-value-confirmation-chronology/
          if-no-files-found: warn
          retention-days: 14
