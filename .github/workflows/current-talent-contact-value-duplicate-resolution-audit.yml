name: Current Talent contact-value duplicate-resolution audit

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - scripts/audit_current_talent_contact_value_duplicate_resolution.py
      - .github/workflows/current-talent-contact-value-duplicate-resolution-audit.yml
      - src/universal_baseball/armstjc_assets.py
      - src/universal_baseball/armstjc_contacts.py
      - src/universal_baseball/certification.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile duplicate-resolution audit
        run: python -m py_compile scripts/audit_current_talent_contact_value_duplicate_resolution.py

      - name: Audit existing duplicate resolver
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_current_talent_contact_value_duplicate_resolution.py

      - name: Upload duplicate-resolution audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-duplicate-resolution
          path: reports/generated/current-talent-contact-value-duplicate-resolution/
          if-no-files-found: warn
          retention-days: 14
