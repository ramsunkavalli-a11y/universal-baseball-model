# retrigger target materialization; no target-contract change
name: Playing-time v1 target surface

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify target-surface materializer
        run: python -m py_compile scripts/materialize_playing_time_v1_target_surface.py

      - name: Download immutable development targets
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-development-evidence
          path: inputs/development-evidence
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32097702869
          github-token: ${{ github.token }}

      - name: Download immutable frozen B2 snapshots
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-current-talent-snapshots
          path: inputs/current-talent-snapshots
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32099733186
          github-token: ${{ github.token }}

      - name: Materialize next-season MLB PA including zeros
        run: >-
          python scripts/materialize_playing_time_v1_target_surface.py
          --development-evidence-root inputs/development-evidence
          --snapshot-root inputs/current-talent-snapshots

      - name: Upload target-surface artifact
        uses: actions/upload-artifact@v7
        with:
          name: playing-time-v1-target-surface
          path: reports/generated/playing-time-v1-target-surface/
          if-no-files-found: error
          retention-days: 14

      - name: Persist target-surface result
        run: |
          set -euo pipefail
          cp reports/generated/playing-time-v1-target-surface/report.json docs/playing-time-v1-target-surface-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/playing-time-v1-target-surface-result.json
          git commit -m "Persist playing-time v1 target-surface result"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
