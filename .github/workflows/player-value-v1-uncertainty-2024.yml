name: Player Value v1 uncertainty 2024

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test uncertainty layer
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]" &&
          python -m pytest -q
          tests/test_player_value_uncertainty.py
          tests/test_player_value_final_aggregation.py
          tests/test_player_value_batting_runs.py
          tests/test_player_value_defense_projection.py
      - name: Download verified final Player Value table
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "9412571491"
          path: inputs/final
          github-token: ${{ github.token }}
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "32385002209"
      - name: Download frozen B2 batting profiles
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "9311172007"
          path: inputs/b2
          github-token: ${{ github.token }}
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "32099733186"
      - name: Download frozen Playing Time surface
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "9326300207"
          path: inputs/playing-time
          github-token: ${{ github.token }}
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "32142089669"
      - name: Download certified MLB batting performance
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "9265954750"
          path: inputs/mlb-performance
          github-token: ${{ github.token }}
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "31955392482"
      - name: Download frozen catcher opportunities
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "9371426672"
          path: inputs/catcher-opportunities
          github-token: ${{ github.token }}
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "32269076231"
      - name: Materialize 3,051-player forecast intervals
        run: >-
          python scripts/materialize_player_value_v1_uncertainty_2024.py
          --final-table inputs/final/reports/generated/player-value-v1-final-2024.parquet
          --final-json inputs/final/docs/player-value-v1-final-2024.json
          --b2-profile inputs/b2/tables/projection_2023_to_2024/frozen_b2_profile.parquet
          --playing-time-scored inputs/playing-time/tables/candidate_2024_scored.parquet
          --playing-time-coefficients inputs/playing-time/tables/candidate_2024_coefficients.parquet
          --mlb-performance-root inputs/mlb-performance
          --catcher-opportunities inputs/catcher-opportunities/scored_opportunities.parquet
          --output-json docs/player-value-v1-uncertainty-2024.json
          --output-table reports/generated/player-value-v1-uncertainty-2024.parquet
      - name: Verify byte-deterministic rerun
        run: |
          set -euo pipefail
          mkdir -p /tmp/player-value-uncertainty-rerun
          python scripts/materialize_player_value_v1_uncertainty_2024.py \
            --final-table inputs/final/reports/generated/player-value-v1-final-2024.parquet \
            --final-json inputs/final/docs/player-value-v1-final-2024.json \
            --b2-profile inputs/b2/tables/projection_2023_to_2024/frozen_b2_profile.parquet \
            --playing-time-scored inputs/playing-time/tables/candidate_2024_scored.parquet \
            --playing-time-coefficients inputs/playing-time/tables/candidate_2024_coefficients.parquet \
            --mlb-performance-root inputs/mlb-performance \
            --catcher-opportunities inputs/catcher-opportunities/scored_opportunities.parquet \
            --output-json /tmp/player-value-uncertainty-rerun/result.json \
            --output-table /tmp/player-value-uncertainty-rerun/table.parquet
          cmp docs/player-value-v1-uncertainty-2024.json /tmp/player-value-uncertainty-rerun/result.json
          cmp reports/generated/player-value-v1-uncertainty-2024.parquet /tmp/player-value-uncertainty-rerun/table.parquet
      - name: Persist verified uncertainty result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-uncertainty-2024.json
          git commit -m "Freeze Player Value v1 forecast intervals"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
      - name: Upload complete uncertainty table
        uses: actions/upload-artifact@v7
        with:
          name: player-value-v1-uncertainty-2024
          path: |
            docs/player-value-v1-uncertainty-2024.json
            reports/generated/player-value-v1-uncertainty-2024.parquet
          if-no-files-found: error
          retention-days: 90
