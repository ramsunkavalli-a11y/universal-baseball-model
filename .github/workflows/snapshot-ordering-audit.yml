name: Snapshot ordering audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 2025-aaa-mar-apr
            left_asset: 2025_3_aaa_pbp.csv
            right_asset: 2025_4_aaa_pbp.csv
          - slug: 2023-rookie-jul-aug
            left_asset: 2023_7_rk_pbp.csv
            right_asset: 2023_8_rk_pbp.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Audit ${{ matrix.slug }}
        run: |
          python scripts/audit_armstjc_partitions.py \
            --left-asset "${{ matrix.left_asset }}" \
            --right-asset "${{ matrix.right_asset }}" \
            --left-url "https://github.com/armstjc/milb-data-repository/releases/download/pbp/${{ matrix.left_asset }}" \
            --right-url "https://github.com/armstjc/milb-data-repository/releases/download/pbp/${{ matrix.right_asset }}" \
            --work-dir "data/quarantine/snapshot-ordering/${{ matrix.slug }}" \
            --report-dir "reports/generated/snapshot-ordering/${{ matrix.slug }}"

      - name: Upload ${{ matrix.slug }} report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-ordering-${{ matrix.slug }}
          path: reports/generated/snapshot-ordering/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14
