name: Defense v1 2024 framing predictor segmented recovery

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  segment:
    name: source segment ${{ matrix.segment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        segment: [mar, apr, may, jun, jul, aug, sep, oct]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned source dependency
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install "sportsdataverse==0.0.75"
      - name: Verify frozen pre-2025 framing boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          params = json.loads(Path("docs/defense-v1-framing-repair-parameters.json").read_text())
          if params.get("parameter_hash") != "sha256:e75ebd58d868b6cb6d51f2d0e48d49c1735a4cfa80661b6280269311a7875086":
              raise SystemExit("framing parameter hash changed")
          if params.get("decision", {}).get("2024_framing_confirmation_predictor_materialization_authorized_next") is not True:
              raise SystemExit("2024 framing predictor source is not authorized")
          if params.get("boundary", {}).get("2025_framing_target_accessed") is not False:
              raise SystemExit("2025 framing target boundary already crossed")
          print("segmented recovery boundary verified")
          PY
      - name: Compile segment source
        run: python -m py_compile scripts/materialize_defense_v1_2024_framing_predictor_segment.py
      - name: Materialize source segment
        run: >-
          python -u scripts/materialize_defense_v1_2024_framing_predictor_segment.py
          --segment "${{ matrix.segment }}"
          --output-root "reports/generated/framing-segment-${{ matrix.segment }}"
      - name: Upload segment
        uses: actions/upload-artifact@v7
        with:
          name: framing-segment-${{ matrix.segment }}
          path: reports/generated/framing-segment-${{ matrix.segment }}/
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: reassemble full season and derive frozen framing predictor
    needs: segment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned source dependency
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install "sportsdataverse==0.0.75"
      - name: Download all non-overlapping source segments
        uses: actions/download-artifact@v8
        with:
          pattern: framing-segment-*
          path: inputs/segments
          merge-multiple: true
      - name: Compile aggregator
        run: python -m py_compile scripts/aggregate_defense_v1_2024_framing_predictor_segments.py
      - name: Reassemble and derive exact full-season predictor
        run: >-
          python -u scripts/aggregate_defense_v1_2024_framing_predictor_segments.py
          --segments-root inputs/segments
          --output-root reports/generated/defense-v1-2024-framing-predictor
      - name: Pin source workflow metadata
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("reports/generated/defense-v1-2024-framing-predictor/report.json")
          result = json.loads(path.read_text())
          result["source_run_id"] = int(os.environ["SOURCE_RUN_ID"])
          result["source_sha"] = os.environ["SOURCE_SHA"]
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload certified 2024 framing predictor
        uses: actions/upload-artifact@v7
        with:
          name: defense-v1-2024-framing-predictor
          path: reports/generated/defense-v1-2024-framing-predictor/
          if-no-files-found: error
          retention-days: 30
      - name: Persist binding 2024 framing predictor result
        run: |
          set -euo pipefail
          cp reports/generated/defense-v1-2024-framing-predictor/report.json docs/defense-v1-2024-framing-predictor-source-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-2024-framing-predictor-source-result.json
          git commit -m "Persist Defense v1 2024 framing predictor source"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
