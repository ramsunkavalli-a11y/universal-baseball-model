name: Full-season contact identity reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/full-season-contact-identity-reconciliation.yml"
      - "scripts/audit_player_game_snapshot_conflicts.py"
      - "src/universal_baseball/player_game_stats.py"
      - "tests/test_player_game_stats.py"

permissions:
  contents: read

jobs:
  diagnose-2024-aaa-player-game-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Diagnose 2024 AAA player-game snapshot conflicts
        run: python scripts/audit_player_game_snapshot_conflicts.py

      - name: Upload player-game snapshot diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-game-snapshot-conflicts
          path: reports/generated/player-game-snapshot-conflicts/
          if-no-files-found: warn
          retention-days: 14
