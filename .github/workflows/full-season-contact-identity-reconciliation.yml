name: Full-season contact identity reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localize-2024-aaa-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Localize 2024 AAA contact attribution with player-game boxscores
        run: python scripts/audit_player_game_contact_localization.py

      - name: Upload player-game localization report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-game-contact-localization
          path: reports/generated/player-game-contact-localization/
          if-no-files-found: warn
          retention-days: 14
