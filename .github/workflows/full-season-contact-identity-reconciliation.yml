name: Full-season contact identity reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/full-season-contact-identity-reconciliation.yml"
      - "scripts/audit_full_season_contact_identity_reconciliation.py"
      - "src/universal_baseball/armstjc_assets.py"
      - "src/universal_baseball/season_stats.py"
      - "src/universal_baseball/certification.py"

permissions:
  contents: read

jobs:
  reconcile-2024-aaa-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Reconcile 2024 AAA contacts to season aggregates
        run: python scripts/audit_full_season_contact_identity_reconciliation.py

      - name: Upload contact identity reconciliation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-season-contact-identity-reconciliation
          path: reports/generated/full-season-contact-identity-reconciliation/
          if-no-files-found: warn
          retention-days: 14
