name: Independent 2024 AAA bin value confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-aaa-pooling:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Confirm pre-specified AAA pooling rule on 2024
        run: python scripts/audit_aaa_bin_value_independent_validation.py --games-per-league 45

      - name: Upload independent AAA confirmation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aaa-bin-value-independent-validation
          path: reports/generated/aaa-bin-value-independent-validation/
          if-no-files-found: warn
          retention-days: 14
