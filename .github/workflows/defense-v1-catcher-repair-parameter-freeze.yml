name: Defense v1 catcher repair parameter freeze

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    name: freeze repaired catcher parameters before 2025
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and frozen Defense dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"
          && python -m pip install "sportsdataverse==0.0.75"

      - name: Resolve and verify repaired development/source gates
        id: gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path("docs/defense-v1-catcher-repair-development-source-result.json").read_text())
          dev = json.loads(Path("docs/defense-v1-catcher-repair-development-result.json").read_text())
          if source.get("status") != "source_materialized_ready_for_repaired_development":
              raise SystemExit("repaired catcher source not certified")
          if int(source.get("source_run_id")) != 32206603934:
              raise SystemExit(f"unexpected repaired source run {source.get('source_run_id')}")
          if source.get("boundary", {}).get("2025_catcher_target_accessed") is not False:
              raise SystemExit("repaired source crossed 2025 boundary")
          if dev.get("status") != "repaired_development_complete":
              raise SystemExit("repaired catcher development not complete")
          decision = dev.get("decision", {})
          for kind in ("throwing", "blocking"):
              if decision.get(f"catcher_{kind}_passed") is not True:
                  raise SystemExit(f"{kind} did not pass repaired development")
              if decision.get(f"catcher_{kind}_selected_family") != "C2":
                  raise SystemExit(f"{kind} repaired family is not C2")
          if dev.get("boundary", {}).get("2025_catcher_target_accessed") is not False:
              raise SystemExit("repaired development crossed 2025 boundary")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as h:
              h.write(f"source_run_id={int(source['source_run_id'])}\n")
          print("repaired catcher development gate verified")
          PY

      - name: Download certified historical fielding source
        uses: actions/download-artifact@v7
        with:
          name: position-role-historical-source-2021-2024
          path: inputs/historical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32148467330

      - name: Download repaired 2022-2024 catcher targets
        uses: actions/download-artifact@v7
        with:
          name: defense-v1-catcher-repair-development-source
          path: inputs/repaired-targets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gates.outputs.source_run_id }}

      - name: Verify freeze script compiles
        run: python -m py_compile scripts/freeze_defense_v1_catcher_repair_parameters.py

      - name: Freeze repaired catcher parameters
        run: >-
          python -u scripts/freeze_defense_v1_catcher_repair_parameters.py
          --historical-root inputs/historical
          --repaired-source-root inputs/repaired-targets
          --repaired-source-result docs/defense-v1-catcher-repair-development-source-result.json
          --repaired-development-result docs/defense-v1-catcher-repair-development-result.json
          --output-root reports/generated/defense-v1-catcher-repair-parameter-freeze

      - name: Pin freeze workflow metadata
        env:
          FREEZE_RUN_ID: ${{ github.run_id }}
          FREEZE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("reports/generated/defense-v1-catcher-repair-parameter-freeze/report.json")
          result = json.loads(path.read_text())
          result["freeze_run_id"] = int(os.environ["FREEZE_RUN_ID"])
          result["freeze_sha"] = os.environ["FREEZE_SHA"]
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload repaired catcher parameter package
        uses: actions/upload-artifact@v7
        with:
          name: defense-v1-catcher-repair-parameter-freeze
          path: reports/generated/defense-v1-catcher-repair-parameter-freeze/
          if-no-files-found: error
          retention-days: 30

      - name: Persist binding repaired catcher parameter result
        run: |
          set -euo pipefail
          cp reports/generated/defense-v1-catcher-repair-parameter-freeze/report.json docs/defense-v1-catcher-repair-parameters.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/defense-v1-catcher-repair-parameters.json
          git commit -m "Persist repaired catcher parameter freeze"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
