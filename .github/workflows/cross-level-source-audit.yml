name: Cross-level source audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cross-level-source-audit.yml"

permissions:
  contents: read

jobs:
  certify-level:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: aa
            asset: 2025_4_aa_pbp.csv
            expected_year: 2025
            expected_month: 4
            expected_level: aa
          - slug: high-a
            asset: 2025_4_a+_pbp.csv
            expected_year: 2025
            expected_month: 4
            expected_level: a+
          - slug: single-a
            asset: 2025_4_a_pbp.csv
            expected_year: 2025
            expected_month: 4
            expected_level: a
          - slug: rookie-june-2024
            asset: 2024_6_rk_pbp.csv
            expected_year: 2024
            expected_month: 6
            expected_level: rk

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Audit ${{ matrix.slug }} source slice
        run: |
          python scripts/certify_armstjc_release.py \
            --url "https://github.com/armstjc/milb-data-repository/releases/download/pbp/${{ matrix.asset }}" \
            --asset-name "${{ matrix.asset }}" \
            --expected-year ${{ matrix.expected_year }} \
            --expected-month ${{ matrix.expected_month }} \
            --expected-level "${{ matrix.expected_level }}" \
            --official-sample-games 3 \
            --work-dir "data/quarantine/armstjc/${{ matrix.slug }}" \
            --report-dir "reports/generated/armstjc/${{ matrix.slug }}"

      - name: Upload ${{ matrix.slug }} audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-level-${{ matrix.slug }}
          path: reports/generated/armstjc/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 14
