name: Player Value v1 baserunning run conversion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify baserunning run conversion
        run: >-
          python -m py_compile
          src/universal_baseball/player_value_baserunning_runs.py
          scripts/materialize_player_value_v1_baserunning_run_conversion.py
          && python -m pytest -q
          tests/test_player_value_baserunning_runs.py

      - name: Materialize frozen 2024 baserunning reference
        run: >-
          python scripts/materialize_player_value_v1_baserunning_run_conversion.py
          --output docs/player-value-v1-baserunning-run-conversion-2024.json

      - name: Persist frozen baserunning reference
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-baserunning-run-conversion-2024.json
          if git diff --cached --quiet; then
            echo "Baserunning run-conversion artifact unchanged; validation succeeded."
            exit 0
          fi
          git commit -m "Materialize frozen baserunning run conversion"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
