name: Player Value v1 MLB run environment

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/player-value-v1-mlb-run-environment.yml"
      - "src/universal_baseball/player_value_mlb_run_environment.py"
      - "src/universal_baseball/player_value_runs_per_win.py"
      - "tests/test_player_value_mlb_run_environment.py"
      - "scripts/materialize_player_value_v1_mlb_run_environment.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e ".[dev]"

      - name: Verify helpers
        run: >-
          python -m py_compile src/universal_baseball/player_value_mlb_run_environment.py
          && python -m pytest -q tests/test_player_value_mlb_run_environment.py

      - name: Materialize certified 2024 MLB run environment
        run: >-
          python scripts/materialize_player_value_v1_mlb_run_environment.py
          --season 2024
          --output docs/player-value-v1-mlb-run-environment-2024.json

      - name: Persist run environment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-value-v1-mlb-run-environment-2024.json
          git commit -m "Materialize 2024 MLB run environment"
          for attempt in 1 2 3; do
            git fetch origin source-certification-poc
            if git rebase origin/source-certification-poc && git push origin HEAD:source-certification-poc; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
