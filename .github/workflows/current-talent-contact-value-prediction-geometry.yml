name: Current Talent contact-value prediction geometry

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - "src/universal_baseball/current_talent_contact_value.py"
      - "src/universal_baseball/current_talent_contact_value_prediction.py"
      - "scripts/materialize_current_talent_contact_value_prediction_geometry.py"
      - ".github/workflows/current-talent-contact-value-prediction-geometry.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify prediction geometry contracts
        run: >-
          python -m pytest
          tests/test_current_talent_contact_value.py
          tests/test_current_talent_contact_value_prediction.py

      - name: Seed accepted baseline fit artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-baseline-fits
          path: seeded/baseline
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075112279
          github-token: ${{ github.token }}

      - name: Seed accepted richer feature artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-features
          path: seeded/features
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075892988
          github-token: ${{ github.token }}

      - name: Require persisted frozen 2021 residual fit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/current-talent-contact-value-residual-fit-result.json")
          report = json.loads(path.read_text())
          if report.get("gate") != "current_talent_contact_value_residual_fit_2021_training_only":
              raise SystemExit("unexpected residual-fit gate")
          boundary = report.get("boundary", {})
          if boundary.get("coefficient_fit_uses_2021_only") is not True:
              raise SystemExit("residual fit is not 2021-only")
          for field in (
              "2022_future_outcomes_accessed",
              "accessed_2023",
              "development_losses_computed",
              "model_scoring",
          ):
              if boundary.get(field) is not False:
                  raise SystemExit(f"residual fit boundary violation: {field}")
          print(json.dumps(report["residual_fit"], indent=2))
          PY

      - name: Compile prediction geometry materializer
        run: python -m py_compile scripts/materialize_current_talent_contact_value_prediction_geometry.py

      - name: Materialize fixed 2022 prediction geometry without scoring
        run: >-
          python scripts/materialize_current_talent_contact_value_prediction_geometry.py
          --baseline-root seeded/baseline
          --feature-root seeded/features
          --residual-result docs/current-talent-contact-value-residual-fit-result.json

      - name: Persist prediction geometry result in branch
        run: |
          cp reports/generated/current-talent-contact-value-prediction-geometry/report.json docs/current-talent-contact-value-prediction-geometry-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-talent-contact-value-prediction-geometry-result.json
          git diff --cached --quiet || git commit -m "Persist Challenger 2 prediction geometry"
          git push

      - name: Upload prediction geometry artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-prediction-geometry
          path: reports/generated/current-talent-contact-value-prediction-geometry/
          if-no-files-found: warn
          retention-days: 14
