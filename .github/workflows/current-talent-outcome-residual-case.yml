name: Current Talent outcome residual case diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - source-certification-poc
    paths:
      - ".github/workflows/current-talent-outcome-residual-case.yml"
      - "scripts/diagnose_current_talent_outcome_residual_case.py"
      - "scripts/diagnose_current_talent_2021_rk_team_residuals.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Diagnose historical outcome residual case
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/diagnose_current_talent_outcome_residual_case.py

      - name: Diagnose 2021 Rookie residuals by team
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/diagnose_current_talent_2021_rk_team_residuals.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-outcome-residual-case-2021-rk-703595-130
          path: reports/generated/current-talent-outcome-residual-case/
          if-no-files-found: warn
          retention-days: 14
