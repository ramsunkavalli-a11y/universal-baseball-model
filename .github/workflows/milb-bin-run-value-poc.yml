name: MiLB bin run value POC

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/milb-bin-run-value-poc.yml"
      - "scripts/audit_milb_bin_run_values.py"
      - "src/universal_baseball/official_capture.py"
      - "src/universal_baseball/run_expectancy.py"
      - "src/universal_baseball/performance_events.py"
      - "src/universal_baseball/state_transitions_v2.py"

permissions:
  contents: read

jobs:
  audit-milb-bin-values:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Build MiLB bin run-value POC
        run: python scripts/audit_milb_bin_run_values.py --games-per-league 15

      - name: Upload MiLB bin run-value report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: milb-bin-run-value-poc
          path: reports/generated/milb-bin-run-value-poc/
          if-no-files-found: warn
          retention-days: 14
