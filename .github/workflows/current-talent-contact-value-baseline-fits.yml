name: Current Talent contact-value baseline fits

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - "src/universal_baseball/current_talent_contact_value_baseline.py"
      - "scripts/audit_current_talent_contact_value_baseline_fits.py"
      - "tests/test_current_talent_contact_value_baseline.py"
      - ".github/workflows/current-talent-contact-value-baseline-fits.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify sufficient-statistics equivalence
        run: python -m pytest tests/test_current_talent_contact_value_baseline.py

      - name: Seed accepted combined chronology artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-chronology
          path: seeded/chronology
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32074805618
          github-token: ${{ github.token }}

      - name: Compile baseline fit audit
        run: python -m py_compile scripts/audit_current_talent_contact_value_baseline_fits.py

      - name: Fit frozen baselines without scoring
        run: >-
          python scripts/audit_current_talent_contact_value_baseline_fits.py
          --chronology-root seeded/chronology

      - name: Upload baseline fit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-baseline-fits
          path: reports/generated/current-talent-contact-value-baseline-fits/
          if-no-files-found: warn
          retention-days: 14
