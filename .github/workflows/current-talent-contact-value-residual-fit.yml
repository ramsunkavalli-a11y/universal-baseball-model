name: Current Talent contact-value residual fit

on:
  push:
    branches:
      - source-certification-poc
    paths:
      - "src/universal_baseball/current_talent_contact_value.py"
      - "scripts/fit_current_talent_contact_value_residual.py"
      - ".github/workflows/current-talent-contact-value-residual-fit.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify frozen WLS contracts
        run: python -m pytest tests/test_current_talent_contact_value.py

      - name: Seed accepted baseline fit artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-baseline-fits
          path: seeded/baseline
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075112279
          github-token: ${{ github.token }}

      - name: Seed accepted richer feature artifact
        uses: actions/download-artifact@v8
        with:
          name: current-talent-contact-value-features
          path: seeded/features
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32075892988
          github-token: ${{ github.token }}

      - name: Compile residual fitter
        run: python -m py_compile scripts/fit_current_talent_contact_value_residual.py

      - name: Fit fixed 2021 residual without development scoring
        shell: bash
        run: |
          set +e
          set -o pipefail
          root="reports/generated/current-talent-contact-value-residual-fit"
          mkdir -p "$root"
          python scripts/fit_current_talent_contact_value_residual.py \
            --baseline-root seeded/baseline \
            --feature-root seeded/features \
            2>&1 | tee "$root/fit.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$root/fit-exit-code.txt"
          exit "$status"

      - name: Persist fit result or diagnostics in branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="reports/generated/current-talent-contact-value-residual-fit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$root/report.json" ]; then
            cp "$root/report.json" docs/current-talent-contact-value-residual-fit-result.json
          fi
          if [ -f "$root/fit.log" ]; then
            cp "$root/fit.log" docs/current-talent-contact-value-residual-fit-latest.log
          fi
          if [ -f "$root/fit-exit-code.txt" ]; then
            cp "$root/fit-exit-code.txt" docs/current-talent-contact-value-residual-fit-exit-code.txt
          fi
          git add \
            docs/current-talent-contact-value-residual-fit-result.json \
            docs/current-talent-contact-value-residual-fit-latest.log \
            docs/current-talent-contact-value-residual-fit-exit-code.txt \
            2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -f "$root/report.json" ]; then
            git commit -m "Persist frozen Challenger 2 residual fit"
          else
            git commit -m "Persist Challenger 2 residual fit diagnostics"
          fi
          git push

      - name: Upload residual-fit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-contact-value-residual-fit
          path: reports/generated/current-talent-contact-value-residual-fit/
          if-no-files-found: warn
          retention-days: 14
