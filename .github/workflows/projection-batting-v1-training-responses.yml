name: Projection batting v1 training responses

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify training-response code before artifact downloads
        run: >-
          python -m py_compile
          src/universal_baseball/projection_training.py
          scripts/materialize_projection_batting_v1_training_responses.py
          && python -m pytest -q tests/test_projection_training.py

      - name: Download immutable development-target artifact
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-development-evidence
          path: inputs/development-evidence
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32097702869
          github-token: ${{ github.token }}

      - name: Download immutable frozen B2 snapshot artifact
        uses: actions/download-artifact@v8
        with:
          name: projection-batting-v1-current-talent-snapshots
          path: inputs/current-talent-snapshots
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: 32099733186
          github-token: ${{ github.token }}

      - name: Materialize authorized Projection training responses
        run: >-
          python scripts/materialize_projection_batting_v1_training_responses.py
          --development-evidence-root inputs/development-evidence
          --snapshot-root inputs/current-talent-snapshots

      - name: Upload Projection training responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: projection-batting-v1-training-responses
          path: reports/generated/projection-batting-v1-training-responses/
          if-no-files-found: warn
          retention-days: 14
