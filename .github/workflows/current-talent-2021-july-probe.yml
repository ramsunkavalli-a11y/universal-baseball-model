name: Current Talent 2021 July support probe

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: 2021 cutoff date
        required: true
        default: "2021-07-15"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AS_OF_DATE: ${{ inputs.as_of_date }}
      HALF_LIFE_DAYS: "90"
      PRIOR_STRENGTH_CORE_EVENTS: "100"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run targeted regression tests
        run: >-
          python -m pytest
          tests/test_current_talent_ablation.py
          tests/test_current_talent_baselines.py
          tests/test_current_talent_scoring.py
          tests/test_current_talent_score_diagnostics.py
          tests/test_current_talent_translation.py
          tests/test_chadwick.py
      - name: Download certified 2021 MiLB evidence
        uses: actions/download-artifact@v8
        with:
          pattern: ct-validation-game-evidence-2021-*
          path: reports/generated/current-talent-july-probe-inputs/2021/milb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "31980820797"
          github-token: ${{ github.token }}
      - name: Download certified 2021 MLB evidence
        uses: actions/download-artifact@v8
        with:
          name: current-talent-historical-mlb-2021
          path: reports/generated/current-talent-july-probe-inputs/2021/mlb
          repository: ramsunkavalli-a11y/universal-baseball-model
          run-id: "31986504169"
          github-token: ${{ github.token }}
      - name: Run fitted-vs-zero 2021 July probe
        run: >-
          python scripts/materialize_current_talent_translation_ablation.py
          --input-root "reports/generated/current-talent-july-probe-inputs/2021/milb"
          --mlb-input-root "reports/generated/current-talent-july-probe-inputs/2021/mlb"
          --season "2021"
          --as-of-date "${AS_OF_DATE}"
          --half-life-days "${HALF_LIFE_DAYS}"
          --prior-strength-core-events "${PRIOR_STRENGTH_CORE_EVENTS}"
          --output-dir "reports/generated/current-talent-july-probe/2021/${AS_OF_DATE}"
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-talent-2021-july-probe-${{ env.AS_OF_DATE }}
          path: reports/generated/current-talent-july-probe/2021/${{ env.AS_OF_DATE }}/
          if-no-files-found: warn
          retention-days: 14
