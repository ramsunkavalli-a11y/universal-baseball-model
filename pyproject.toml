[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-baseball-model"
version = "1.0.0"
description = "Public-data baseball player evaluation and projection system."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "ramsunkavalli-a11y"}]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0,<2",
    "numpy>=2.0,<3",
    "polars>=1.0,<2",
    "python-mlb-statsapi>=1,<2",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
playing-time = [
    "scikit-learn>=1.7,<1.8",
    "statsmodels>=0.14.6,<0.15",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.16,<0.17",
    "scikit-learn>=1.7,<1.8",
    "statsmodels>=0.14.6,<0.15",
]

[project.urls]
Repository = "https://github.com/ramsunkavalli-a11y/universal-baseball-model"
Documentation = "https://github.com/ramsunkavalli-a11y/universal-baseball-model/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::SyntaxWarning",
    "error::polars.exceptions.PolarsInefficientMapWarning",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W605"]
