[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-baseball-model"
version = "0.0.1"
description = "Public-data baseball player evaluation and projection system."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0,<2",
    "python-mlb-statsapi>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
